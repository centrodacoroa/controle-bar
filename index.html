body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fdfbf3;color:#1d1d1b}

.pb{flex:1;overflow:auto;padding:12px}
.aviso{background:#fbe3e1;color:#7a1712;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:15px}

.he{display:flex;gap:10px;padding:3px 0}.he span{color:#888;min-width:44px;font-variant-numeric:tabular-nums}
.hx{color:#b3261e}

.prods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.prod .e{display:block;font-size:26px}

.tit{font-size:13px;color:#888;text-transform:uppercase;font-weight:700;margin:2px 2px 8px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{border:2px solid #e4e4de;border-radius:14px;background:#fff;padding:8px 4px;font-size:15px;font-weight:700;min-height:72px;position:relative;color:#1d1d1b;line-height:1.15}
.cat .e{display:block;font-size:26px;margin-bottom:2px}
.cat .p{display:block;font-weight:400;color:#1f5c3a;font-size:13px}

.abre{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#e3f1e8;border:2px solid #1f5c3a;border-radius:14px;padding:12px 8px 8px}
.abre .prod{background:#fff;min-height:66px}
.pf{display:grid;grid-template-columns:2fr 1fr;gap:8px;padding:10px 12px 16px;border-top:1px solid #eee}
.pf button,.btn{border:0;border-radius:12px;padding:16px 6px;font-size:17px;font-weight:700}
.b1{background:#eee;color:#333}.b2{background:#fbe3e1;color:#b3261e}.b3{background:#1f5c3a;color:#fff}.b4{background:#1a73c9;color:#fff}
.fechar{display:none;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 0}
.fechar.on{display:grid}
.fechar .w{grid-column:1/3}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#1d1d1b;color:#fff;padding:10px 18px;border-radius:20px;font-size:16px;opacity:0;transition:.15s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
.dono table{width:100%;border-collapse:collapse}.dono td{padding:6px;border-bottom:1px solid #eee}
.dono input{font-size:16px;padding:8px;border:1px solid #ccc;border-radius:8px;width:100%}
.res-dia{font-size:16px;line-height:1.5}

a.btn{display:block;text-align:center;text-decoration:none}
.abas{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 12px 0}

.nota{font-size:13px;color:#777;margin:6px 0}
.mv{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #eee;font-size:14px}.mv span{flex:1}

.gf{width:44px;height:44px;padding:0!important;border:1px solid #ccc!important;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-size:18px;line-height:1}

.prod.cf{padding-top:6px;line-height:1.15}
.toast{max-width:92vw;text-align:center}
.gp button{border:0;border-radius:8px;padding:8px 0}
.gm{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:13px;color:#777}
.gm select{flex:1;font-size:15px;padding:6px;border:1px solid #ccc;border-radius:8px;background:#fff}
.gadd{width:100%;border:1px dashed #1f5c3a;background:transparent;color:#1f5c3a;border-radius:10px;padding:10px;font-size:15px;font-weight:700}
.rl{display:flex;align-items:center;gap:8px;margin-bottom:6px}.rl .res{flex:1;min-width:0;margin:0}

#pForm{max-height:60vh;overflow:auto;padding:0 12px;flex:none}
.pfil{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 12px 0}

.pl{display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee;padding:6px 0;font-size:16px}.pl span{flex:1;min-width:0}.pl small{display:block;color:#b26b00;font-size:12px}

  <div class="rl"><div class="res" id="res"></div><button class="ic" id="bPrecos">💲 Preços</button></div>

  <div class="dup" id="dup"></div>
</div>
<div class="folha" id="folha"></div>

<div class="sheet" id="sheet"><div class="panel">

  <div class="fechar" id="fechar"></div>
  <div class="pf"><button class="b3" id="bVolta">✓ Pronto</button><button class="b1" id="bFechar" style="font-size:15px;font-weight:600">Fechar conta</button></div>
</div></div>

  <div class="ph"><h2>Resumo do dia</h2></div>

</div></div>

function cardapio2(){

  produtos.forEach(p=>{const o=v1[p.nome];if(!o)return;
    if(p.preco===o[2]&&!CERTO2.includes(p.nome))p.est=true;
    if(MUDA2[p.nome]){p.nome=MUDA2[p.nome];if(p.nome==='Halls Extra Forte'&&p.foto==='fotos/halls.jpg')p.foto=fotoPadrao(p.nome)}});
  const tem=new Set(produtos.map(p=>normal(p.nome)));
  Object.entries(NOVOS2).forEach(([cat,l])=>l.forEach(x=>{const [nome,preco]=Array.isArray(x)?x:[x,cat==='cerveja'?18:cat==='refri'?10:0];
    if(tem.has(normal(nome)))return;
    const p={id:'n'+normal(nome).replace(/ /g,''),e:'',nome,preco,cat,foto:fotoPadrao(nome)||undefined};if(preco&&cat!=='sorvete')p.est=true;produtos.push(p)}));
  const usadas=new Set(produtos.map(p=>p.cat)), ant={}, nomeV1={};cats.forEach(c=>ant[c.id]=c);CATS0.forEach(c=>nomeV1[c.id]=c.nome);
  const base=CATS2.filter(c=>ant[c[0]]||usadas.has(c[0])).map(([id,e,nome])=>ant[id]&&ant[id].nome!==nomeV1[id]?ant[id]:{id,e,nome});
  cats=base.concat(cats.filter(c=>!CATS2.some(x=>x[0]===c.id)));
  cardV=CARD_V;
}

/* Estado salvo sem "cats" = versão antiga: troca os exemplos pelo cardápio sem perder nada.
 - produto com o mesmo nome de um item do cardápio vira esse item (mantém id, estoque e custo; se não era exemplo, mantém o preço do dono)
 - exemplo sem estoque lançado sai; o resto fica em "Sem categoria" para o dono mover ou apagar */
function migrar(){
  const ids=()=>new Set(cats.map(c=>c.id));
  if(!Array.isArray(cats)){
    cats=CATS0.map(c=>({...c}));
    const novos=cardapio(), usados=new Set(), manter=[], validas=ids();
    (produtos||[]).forEach(p=>{
      const ex=EXEMPLOS[p.id]===p.nome;
      const igual=novos.find(n=>!usados.has(n)&&normal(n.nome)===normal(p.nome));
      if(igual){usados.add(igual);igual.id=p.id;if(p.custo)igual.custo=p.custo;if(!ex){igual.preco=p.preco;if(p.e)igual.e=p.e}return}
      if(ex&&!mov.some(m=>m.p===p.id))return;
      manter.push({...p,cat:validas.has(p.cat)?p.cat:''});
    });
    produtos=novos.concat(manter);
  }
  if(cardV<CARD_V)cardapio2();
  const v=ids();produtos.forEach(p=>{if(!v.has(p.cat))p.cat=''});
  /* foto: undefined = nunca teve (pode ganhar a do app); '' = o dono tirou; 'fotos/…' = do app; 'data:…' = tirada no celular */
  // v2 (fotos do bar): até a v1 o app gravava '' em quem não tinha foto do app, então nessa subida '' também recebe a foto nova
  if(fotosV<FOTOS_V){produtos.forEach(p=>{if(p.foto===undefined||(fotosV<2&&p.foto==='')){const f=fotoPadrao(p.nome);if(f)p.foto=f}});fotosV=FOTOS_V}
}

  $('#folha').innerHTML=h||`<div class="vazio">${q?'Ninguém com esse nome hoje.':'Folha em branco. Escreva o primeiro nome lá em cima.'}</div>`;

  const iguais=doDia().filter(c=>c.status==='aberta'&&c.nome.toLowerCase()===n.toLowerCase());
  const dev=devendo().filter(c=>c.nome.toLowerCase()===n.toLowerCase());
  if(iguais.length||dev.length){perguntarDup(n,iguais,dev);return}
  novaConta(n);
}

function novaConta(n){const agora=Date.now(), c={id:uid(),nome:n,dia,itens:[],status:'aberta',t:agora,abertaEm:agora,hist:[{t:agora,k:'abriu'}]};contas.push(c);salvar();abrir(c.id)}

 conta.hist = [{t,k:'abriu'|'+'|'-'|'pagou'|'devendo'|'reabriu',n?:produto,f?:'pix'|'dinheiro'}]; abertaEm / pagoEm / devendoEm = horas.

const hora=t=>new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

  return [{t:abertaEm(c),k:'abriu',aprox:!c.abertaEm},...c.itens.map(i=>({t:i.t,k:'+',n:i.nome})).sort((a,b)=>a.t-b.t)];
}
function evento(c,e){if(!c.hist)c.hist=histDe(c);c.hist.push(e)}
function htmlHist(c){
  const d0=c.dia, fmt=t=>{const d=dstr(new Date(t));return (d!==d0?dbr(d)+' ':'')+hora(t)};
  const txt=e=>e.k==='abriu'?(e.aprox?'abriu (aprox.)':'abriu a conta'):e.k==='+'?'+1 '+esc(e.n):e.k==='-'?'<b class="hx">tirou 1 '+esc(e.n)+'</b>':
    e.k==='pagou'?'<b>pagou no '+(e.f==='pix'?'Pix':'dinheiro')+'</b>':e.k==='devendo'?'<b class="hx">ficou devendo</b>':'reabriu a conta';
  return histDe(c).map(e=>`<div class="he"><span>${fmt(e.t)}</span>${txt(e)}</div>`).join('');
}
let verHist=false;
/* total escondido: o cliente vê a tela, e ver quanto já gastou pode frear o consumo. Só aparece no "Ver total" (some sozinho em 6 s)
 ou na hora de fechar a conta (botões Pix/Dinheiro). */
let verTot=false, verTotT=null;
function mostrarTotal(on){clearTimeout(verTotT);verTot=on;if(on)verTotT=setTimeout(()=>{verTot=false;if(aberta)renderConta()},6000);if(aberta)renderConta()}
function abrir(id){ultimo=null;catAberta=null;verHist=false;clearTimeout(verTotT);verTot=false;topIds=maisPedidos();aberta=contas.find(c=>c.id===id);$('#dup').style.display='none';$('#fechar').classList.remove('on');$('#sheet').classList.add('on');renderConta()}
function renderConta(){
  const c=aberta, g=agrupa(c.itens), trav=c.status!=='aberta';
  const ver=verTot||$('#fechar').classList.contains('on');
  $('#sNome').textContent=c.nome;
  $('#sTot').innerHTML=ver?`<button class="vt on" id="bTot">${brl(total(c))}</button>`:`<button class="vt" id="bTot">👁 Ver total</button>`;
  $('#bTot').onclick=()=>mostrarTotal(!verTot);
  let h='';
  const outras=devendo().filter(x=>x.id!==c.id&&x.nome.toLowerCase()===c.nome.toLowerCase());
  if(outras.length&&c.status==='aberta')h+=`<div class="aviso">⚠︎ ${esc(c.nome)} está devendo ${ver?brl(outras.reduce((s,x)=>s+total(x),0))+' ':''}de ${outras.map(x=>dbr(x.dia)).join(', ')}. <u data-ab="${outras[0].id}">Ver</u></div>`;
  if(c.status==='devendo')h+=`<div class="aviso">Ficou devendo desde ${dbr(c.dia)}. Quando pagar, toque em "Fechar conta".</div>`;
  if(c.status==='paga')h+=`<div class="aviso ok">Paga em ${dbr(c.pagoDia)} no ${c.forma==='pix'?'Pix':'dinheiro'}.</div>`;
  h+=`<div class="lista"><b>Pegou:</b>${Object.keys(g).length?Object.entries(g).map(([pid,x])=>`<div class="pg${pid===ultimo?' novo1':''}"><span><b class="qq">${x.q}×</b> ${esc(x.nome)}</span>${ver?`<b>${brl(x.v)}</b>`:''}${trav?'':`<button class="menos" data-m="${pid}">− tirar 1</button>`}</div>`).join(''):' <span style="color:#888">nada ainda</span>'}<button class="hb" id="bHist">🕒 Horários ${verHist?'▲':'▼'}</button>${verHist?`<div class="hist">${htmlHist(c)}</div>`:''}</div>`;
  if(!trav){const cont={};c.itens.forEach(i=>cont[i.p]=(cont[i.p]||0)+1);
    const bq=n=>n?`<span class="q">${n}</span>`:'';
    const btn=(p,emo)=>`<button class="prod${p.foto?' cf':''}" data-p="${p.id}">${p.foto?imgFoto(p):emo?`<span class="e">${esc(emoDe(p))}</span>`:''}${esc(p.nome)}<span class="p">${brl(p.preco)}</span>${bq(cont[p.id])}</button>`;
    const top=topIds.map(id=>produtos.find(p=>p.id===id)).filter(p=>p&&p.preco>0);
    if(top.length)h+=`<div class="tit">Mais pedidos</div><div class="prods">${top.map(p=>btn(p,1)).join('')}</div>`;
    const gs=vendaveis(), ia=gs.findIndex(g=>g.id===catAberta);
    if(ia<0)catAberta=null;
    const ins=ia<0?-1:Math.min(Math.floor(ia/3)*3+2,gs.length-1); // painel entra logo abaixo da linha da categoria tocada
    h+=`<div class="tit" style="margin-top:16px">Categorias</div><div class="cats">${gs.map((g,i)=>{
      const n=g.itens.reduce((s,p)=>s+(cont[p.id]||0),0);
      let b=`<button class="cat${i===ia?' on':''}" data-c="${g.id}"><span class="e">${esc(g.e)}</span>${esc(g.nome)}${g.itens.length===1?`<span class="p">${brl(g.itens[0].preco)}</span>`:''}${bq(n)}</button>`;
      if(i===ins){const a=gs[ia];b+=`<div class="abre">${a.itens.map(p=>btn(p,0)).join('')}</div>`}
      return b}).join('')}</div><button class="gadd" id="cNovo" style="margin-top:14px">+ Cadastrar produto que faltou</button>`}
  $('#sBody').innerHTML=h;
  $('#sBody').querySelectorAll('[data-ab]').forEach(u=>u.onclick=()=>abrir(u.dataset.ab));
  if($('#cNovo'))$('#cNovo').onclick=()=>abrirPrecos(true);
  $('#bHist').onclick=()=>{verHist=!verHist;renderConta()};
  $('#sBody').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>lancar(b.dataset.p,!!b.closest('.abre')));
  $('#sBody').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
    if(Date.now()-travaCat<600)return; // o 2º toque de um toque duplo cairia na grade que acabou de mudar
    const g=vendaveis().find(x=>x.id===b.dataset.c);if(!g||!g.itens.length)return;
    if(g.itens.length===1){lancar(g.itens[0].id,false);return}
    catAberta=catAberta===g.id?null:g.id;renderConta();
    const ab=$('#sBody .abre');if(ab)ab.scrollIntoView({block:'nearest',behavior:'smooth'}); // painel inteiro à vista, sem precisar rolar
  });
  $('#sBody').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    const k=c.itens.map(i=>i.p).lastIndexOf(b.dataset.m);if(k<0)return;evento(c,{t:Date.now(),k:'-',n:c.itens[k].nome});const it=c.itens.splice(k,1)[0];ultimo=null;salvar();renderConta();toast('Tirou 1 '+it.nome);
  });
  $('#bFechar').textContent=c.status==='paga'?'Reabrir':'Fechar conta';
  $('#bFechar').style.display=(c.status==='aberta'&&!c.itens.length)?'none':'';
}
function lancar(pid,deCat){
  const c=aberta, agora=Date.now();if(!c||c.status!=='aberta')return;
  if(pid===ultimo&&agora-ultimoT<800){toast('Toque duplo ignorado');return}
  const p=produtos.find(x=>x.id===pid);if(!p||!(p.preco>0))return;
  ultimo=pid;ultimoT=agora;
  if(deCat){catAberta=null;travaCat=agora}
  evento(c,{t:agora,k:'+',n:p.nome}); // antes do push: conta antiga monta o histórico com os itens de antes
  c.itens.push({p:p.id,nome:p.nome,preco:p.preco,t:agora});c.t=agora;
  salvar();renderConta();toast('+1 '+p.nome);if(navigator.vibrate)navigator.vibrate(20);
}

$('#bFechar').onclick=()=>{

$('#nome').oninput=()=>{$('#dup').style.display='none';render()};

/* ----- resumo / fechar o dia ----- */
function textoResumo(){
  const pagosHoje=contas.filter(c=>c.status==='paga'&&c.pagoDia===dia);
  const pix=pagosHoje.filter(c=>c.forma==='pix').reduce((s,c)=>s+total(c),0);
  const din=pagosHoje.filter(c=>c.forma==='dinheiro').reduce((s,c)=>s+total(c),0);
  const fiadoRec=pagosHoje.filter(c=>c.dia!==dia).reduce((s,c)=>s+total(c),0);
  const hojeC=doDia(), vend=hojeC.reduce((s,c)=>s+total(c),0);
  const abertas=hojeC.filter(c=>c.status==='aberta');
  const novoDev=hojeC.filter(c=>c.status==='devendo');
  const dvTot=devendo().reduce((s,c)=>s+total(c),0);
  const g={};hojeC.forEach(c=>c.itens.forEach(i=>{g[i.nome]=g[i.nome]||{q:0,v:0};g[i.nome].q++;g[i.nome].v+=i.preco}));
  const prods=Object.entries(g).sort((a,b)=>b[1].q-a[1].q);
  return {pix,din,fiadoRec,vend,abertas,novoDev,dvTot,prods,n:hojeC.length};
}
function abrirResumo(){
  const r=textoResumo();
  const l=(a,b,cls='')=>`<div class="l ${cls}"><span>${a}</span><b>${b}</b></div>`;
  let h='';
  if(r.abertas.length)h+=`<div class="aviso">⚠︎ Ainda tem ${r.abertas.length} conta(s) aberta(s): ${r.abertas.map(c=>esc(c.nome)).join(', ')}. Feche ou marque "ficou devendo".</div>`;
  h+=`<h3>Caixa</h3>${l('Pix',brl(r.pix))}${l('Dinheiro',brl(r.din))}${l('Total recebido',brl(r.pix+r.din),'big')}`;
  if(r.fiadoRec)h+=`<div style="font-size:14px;color:#666">inclui ${brl(r.fiadoRec)} de dívidas antigas pagas hoje</div>`;
  h+=`<h3>Vendas de hoje</h3>${l('Clientes',r.n)}${l('Vendido',brl(r.vend))}${l('Ficou devendo hoje',brl(r.novoDev.reduce((s,c)=>s+total(c),0)))}${l('Total devendo (todos os dias)',brl(r.dvTot))}`;
  const pgs=contas.filter(c=>c.status==='paga'&&c.pagoDia===dia).sort((a,b)=>(a.pagoEm||0)-(b.pagoEm||0));
  if(pgs.length)h+=`<h3>Pagamentos</h3>${pgs.map(c=>l((c.pagoEm?hora(c.pagoEm)+' · ':'')+esc(c.nome)+' · '+(c.forma==='pix'?'Pix':'dinheiro')+(c.dia!==dia?' (dívida de '+dbr(c.dia)+')':''),brl(total(c)))).join('')}`;
  h+=`<h3>Por produto</h3>${r.prods.map(([n,x])=>l(x.q+'× '+esc(n),brl(x.v))).join('')||'<div style="color:#888">nada vendido</div>'}`;
  $('#rBody').innerHTML=h;
  const t=`*Bar - resumo ${new Date().toLocaleDateString('pt-BR')}*\nPix: ${brl(r.pix)}\nDinheiro: ${brl(r.din)}\n*Recebido: ${brl(r.pix+r.din)}*\nVendido hoje: ${brl(r.vend)} (${r.n} clientes)\nFicou devendo hoje: ${brl(r.novoDev.reduce((s,c)=>s+total(c),0))}${r.novoDev.length?' ('+r.novoDev.map(c=>c.nome).join(', ')+')':''}\nTotal devendo: ${brl(r.dvTot)}\n\n*Produtos*\n${r.prods.map(([n,x])=>x.q+'x '+n+' = '+brl(x.v)).join('\n')}`;
  $('#rZap').href='https://wa.me/?text='+encodeURIComponent(t);
  $('#resumo').classList.add('on');
}
$('#bResumo').onclick=abrirResumo;
$('#rVolta').onclick=()=>$('#resumo').classList.remove('on');

/* ----- backup: arquivo .json com tudo (produtos + histórico completo) ----- */
const BKK='bar_ultimo_backup';
const ultimoBk=()=>{try{return localStorage.getItem(BKK)}catch(e){return null}};
async function enviarBackup(){
  const nome='bar-backup-'+hoje()+'.json';
  const txt=JSON.stringify({app:'controle-bar',versao:5,gerado:new Date().toISOString(),...estado()});
  const arq=new File([txt],nome,{type:'application/json'});
  const marca=()=>{try{localStorage.setItem(BKK,new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}))}catch(e){}if($('#dono').classList.contains('on'))renderDono()};
  try{
    if(navigator.canShare&&navigator.canShare({files:[arq]})){await navigator.share({files:[arq],title:nome});marca();toast('Backup enviado');return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(arq);a.download=nome;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);marca();toast('Backup baixado');
}
function restaurar(f){
  const r=new FileReader();
  r.onload=()=>{try{
    const s=JSON.parse(r.result);if(s.app!=='controle-bar'||!Array.isArray(s.contas))throw 0;
    if(!confirm(`Restaurar backup de ${new Date(s.gerado).toLocaleString('pt-BR')}?\n${s.contas.length} contas. O que está no celular agora será substituído.`))return;
    salvarCopiaSeguranca();
    aplicar(s);salvar();renderDono();render();toast('Backup restaurado'); // backup antigo (sem categorias) passa pela migração
  }catch(e){toast('Arquivo de backup inválido')}};
  r.readAsText(f);
}
/* cópia automática no próprio celular: guarda o estado de antes de cada dia novo (últimos 7) */
function salvarCopiaSeguranca(){try{
  // cópia sem as fotos tiradas no celular (são o que mais ocupa; 7 cópias com fotos lotariam a memória)
  const s=estado();s.produtos=s.produtos.map(p=>String(p.foto||'').startsWith('data:')?{...p,foto:''}:p);
  const k='bar_copia_'+hoje();localStorage.setItem(k,JSON.stringify(s));
  Object.keys(localStorage).filter(x=>x.startsWith('bar_copia_')).sort().slice(0,-7).forEach(x=>localStorage.removeItem(x));
}catch(e){}}
$('#rBk').onclick=enviarBackup;
/* ----- PIN da área do dono (guardado só como hash; impede mexida casual, não é cofre) ----- */
const PINK='bar_pin';
async function hashPin(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bar:'+p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function pedirPin(){
  let salvo=null;try{salvo=localStorage.getItem(PINK)}catch(e){}
  if(!salvo){
    const p1=prompt('Crie um PIN de 4 números para a área do dono:');if(p1===null)return false;
    if(!/^\d{4}$/.test(p1)){toast('O PIN precisa ter 4 números');return false}
    const p2=prompt('Repita o PIN:');if(p2!==p1){toast('PINs diferentes');return false}
    try{localStorage.setItem(PINK,await hashPin(p1))}catch(e){}
    toast('PIN criado');return true}
  const p=prompt('PIN do dono:');if(p===null)return false;
  if(await hashPin(p)===salvo)return true;toast('PIN errado');return false}
$('#bDono').onclick=async()=>{if(!await pedirPin())return;$('#dono').classList.add('on');renderDono()};
/* ===== ESTOQUE (só na área do dono; o balcão não muda nada) =====
 mov = [{id,tipo:'compra'|'contagem',p,q,custo?,calc?,t}]
 Estoque de um produto = última contagem + compras depois dela − vendido depois dela.
 Produto sem nenhuma compra/contagem fica "não controlado" (mostra —). */
let donoAba='estoque', ultimaDif=null;
function vendidos(pid,desde){let n=0;contas.forEach(c=>c.itens.forEach(i=>{if(i.p===pid&&i.t>desde)n++}));return n}
function estoqueDe(pid){
  const ms=mov.filter(m=>m.p===pid);if(!ms.length)return null;
  const cont=ms.filter(m=>m.tipo==='contagem').sort((a,b)=>b.t-a.t)[0];
  const desde=cont?cont.t:0, base=cont?cont.q:0;
  const ent=ms.filter(m=>m.tipo==='compra'&&m.t>desde).reduce((x,m)=>x+m.q,0);
  return base+ent-vendidos(pid,desde);
}
const diasMov=()=>[...new Set(contas.filter(c=>c.itens.length).map(c=>c.dia))].sort().slice(-4);
function mediaDia(pid,ds){if(!ds.length)return 0;let n=0;contas.forEach(c=>{if(ds.includes(c.dia))c.itens.forEach(i=>{if(i.p===pid)n++})});return n/ds.length}
const fmtQ=v=>(Math.round(v*10)/10).toString().replace('.',',');
function renderEstoque(){
  const ds=diasMov();
  const linhas=produtos.map(p=>{
    const tem=estoqueDe(p.id), m=mediaDia(p.id,ds);
    if(tem===null)return {p,tem,m,dura:null,comprar:null};
    const dura=m>0?tem/m:null, comprar=m>0?Math.max(0,Math.ceil(m*1.2-tem)):0;
    return {p,tem,m,dura,comprar};
  });
  const ctl=linhas.filter(l=>l.tem!==null).sort((a,b)=>(a.dura??1e9)-(b.dura??1e9));
  const nao=linhas.filter(l=>l.tem===null);
  const lista=ctl.filter(l=>l.comprar>0);
  let h='';
  if(ultimaDif)h+=ultimaDif;
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn b3" id="eCompra">+ Chegou mercadoria</button><button class="btn b1" id="eCont">Fazer contagem</button></div><div id="eForm"></div>`;
  if(ctl.length){
    h+=`<table class="est" style="margin-top:12px"><tr><th>Produto</th><th>Tem</th><th>Dá p/</th><th>Comprar</th></tr>${ctl.map(l=>{
      const baixo=l.tem<=0||(l.dura!==null&&l.dura<1);
      return `<tr><td>${esc(emoDe(l.p)+' '+l.p.nome)}</td><td class="${l.tem<0?'bx':''}">${l.tem}</td><td class="${baixo?'bx':'ok'}">${l.dura===null?'<span class="nd">—</span>':fmtQ(l.dura)+' dia'+(l.dura>=2?'s':'')}</td><td>${l.comprar?'<b>'+l.comprar+'</b>':'<span class="nd">0</span>'}</td></tr>`}).join('')}</table>`;
    h+=`<p class="nota">"Dá p/" = quantos dias de jogo o estoque aguenta, pela média dos ${ds.length?`últimos ${ds.length} dia(s) com venda`:'dias com venda (ainda não tem)'}. "Comprar" cobre o próximo dia de jogo com 20% de folga.${ds.length<4?' <b>Com menos de 4 dias de histórico é só uma estimativa.</b>':''} Número negativo em "Tem" = vendeu mais do que entrou: falta lançar compra ou fazer contagem.</p>`;
    if(lista.length){const t=`*Lista de compra - ${new Date().toLocaleDateString('pt-BR')}*\n`+lista.map(l=>`${l.comprar}x ${l.p.nome} (tem ${l.tem})`).join('\n');
      h+=`<a class="btn b4" style="margin:8px 0" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(t)}">Mandar lista de compra no WhatsApp</a>`}
  }else h+=`<p class="nota" style="margin-top:12px">Nenhum produto controlado ainda. Comece com <b>Fazer contagem</b> (conta o que tem na geladeira e no depósito) ou lance a próxima mercadoria que chegar.</p>`;
  if(nao.length&&ctl.length)h+=`<p class="nota">Sem controle: ${nao.map(l=>esc(l.p.nome)).join(', ')}.</p>`;
  const ult=[...mov].sort((a,b)=>b.t-a.t).slice(0,12);
  if(ult.length)h+=`<h3 style="margin:18px 0 4px;font-size:14px;color:#888;text-transform:uppercase">Últimos lançamentos</h3>`+ult.map(m=>{const p=produtos.find(x=>x.id===m.p);
    const d=new Date(m.t).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
    const txt=m.tipo==='compra'?`Chegou ${m.q} ${esc(p?p.nome:'(produto apagado)')}${m.custo?' · '+brl(m.custo):''}`:`Contagem: ${m.q} ${esc(p?p.nome:'(produto apagado)')}${m.calc!=null&&m.calc!==m.q?` (app dizia ${m.calc})`:''}`;
    return `<div class="mv"><span>${d} · ${txt}</span><button class="b2" style="border:0;border-radius:8px;padding:6px 10px" data-mx="${m.id}">✕</button></div>`}).join('');
  $('#dBody').innerHTML=h;
  $('#eCompra').onclick=formCompra;$('#eCont').onclick=formContagem;
  $('#dBody').querySelectorAll('[data-mx]').forEach(b=>b.onclick=()=>{if(!b.dataset.ok){b.dataset.ok=1;b.textContent='apagar?';return}mov=mov.filter(m=>m.id!==b.dataset.mx);salvar();renderEstoque();toast('Lançamento apagado')});
}

   <label>Produto</label><select id="cP">${optsProd()}</select>
   <label>Quantas unidades chegaram</label><input id="cQ" inputmode="numeric" placeholder="ex.: 48 (2 fardos de 24)">

function formContagem(){
  $('#eForm').innerHTML=`<div class="cx"><b>Contagem</b><p class="nota" style="margin-top:2px">Conte o que tem de verdade (geladeira + depósito) e escreva só nos produtos que contou. Deixe em branco o que não contou.</p>
   ${porCat().filter(g=>g.itens.length).map(g=>`<h4 style="margin:14px 0 0;font-size:14px;color:#1f5c3a">${esc(g.e+' '+g.nome)}</h4>`+g.itens.map(p=>{const t=estoqueDe(p.id);return `<label>${esc(p.nome)}${t!==null?` <span style="color:#aaa">(app diz ${t})</span>`:''}</label><input data-cp="${p.id}" inputmode="numeric">`}).join('')).join('')}
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn b1" id="kX">Cancelar</button><button class="btn b3" id="kOk">Salvar contagem</button></div></div>`;
  $('#kX').onclick=()=>$('#eForm').innerHTML='';
  $('#kOk').onclick=()=>{
    const agora=Date.now(), difs=[];let n=0;
    $('#eForm').querySelectorAll('[data-cp]').forEach(i=>{
      if(i.value.trim()==='')return;const q=parseInt(i.value,10);if(isNaN(q)||q<0)return;
      const p=produtos.find(x=>x.id===i.dataset.cp), calc=estoqueDe(p.id);
      mov.push({id:uid(),tipo:'contagem',p:p.id,q,calc,t:agora});n++;
      if(calc!==null&&calc!==q)difs.push({p,d:q-calc});
    });
    if(!n){toast('Nenhum número preenchido');return}
    const falta=difs.filter(x=>x.d<0), valor=falta.reduce((s,x)=>s+(-x.d)*x.p.preco,0);
    ultimaDif=difs.length?`<div class="dif${falta.length?' ruim':''}"><b>Contagem salva.</b> ${falta.length?`Sumiram ${falta.map(x=>`${-x.d} ${esc(x.p.nome)}`).join(', ')}: <b>${brl(valor)}</b> no preço de venda (venda sem lançar, consumo, quebra ou erro de contagem).`:''}${difs.filter(x=>x.d>0).length?` Sobrou mais do que o app esperava em: ${difs.filter(x=>x.d>0).map(x=>`${esc(x.p.nome)} (+${x.d})`).join(', ')}, provavelmente compra não lançada.`:''}</div>`
      :`<div class="dif"><b>Contagem salva.</b> ${difs.length===0&&mov.filter(m=>m.tipo==='contagem').length>n?'Bateu certinho com o app.':'A partir de agora o app acompanha esses produtos.'}</div>`;
    salvar();renderEstoque();toast('Contagem salva')};
}

$('#dVolta').onclick=()=>{$('#dono').classList.remove('on');ultimaDif=null;render();botaoPrecos()};
/* foto tirada no celular (câmera ou galeria): reduz para 300×300 em JPEG (~15 KB) antes de guardar */
function reduzFoto(arq){return new Promise((ok,erro)=>{const u=URL.createObjectURL(arq), im=new Image();
  im.onload=()=>{const L=300, c=document.createElement('canvas');c.width=c.height=L;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,L,L);
    const s=Math.min(L/im.width,L/im.height), w=im.width*s, h=im.height*s;x.drawImage(im,(L-w)/2,(L-h)/2,w,h);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};
  im.onerror=()=>{URL.revokeObjectURL(u);erro()};im.src=u})}
$('#fotoArq').onchange=async e=>{const f=e.target.files[0], p=produtos.find(x=>x.id===e.target.dataset.pid);if(!f||!p)return;
  try{p.foto=await reduzFoto(f);salvar();toast('Foto salva');renderDono()}catch(er){toast('Não deu para abrir essa imagem')}};

/* ===== PREÇOS E PRODUTOS (aberto sem PIN, a pedido: só quem tem o link usa) =====
 Cada celular guarda os próprios dados: "Enviar preços" manda um link que atualiza os preços no outro celular. */
let pFil='falta';
const lerPreco=t=>{t=String(t).trim().replace(/r\$|\s/gi,'');if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');return /^\d+(\.\d{1,2})?$/.test(t)?Math.round(parseFloat(t)*100)/100:NaN};
const faltam=()=>produtos.filter(p=>!(p.preco>0)), conferir=()=>produtos.filter(p=>p.preco>0&&p.est);
function botaoPrecos(){const n=faltam().length,b=$('#bPrecos');b.textContent=n?'💲 Faltam '+n+' preços':'💲 Preços';b.classList.toggle('falta',n>0)}
function abrirPrecos(novo){pFil=faltam().length?'falta':conferir().length?'conf':'todos';$('#precos').classList.add('on');$('#pForm').innerHTML='';renderPrecos();if(novo)formNovo()}
function filtros(){$('#pFil').innerHTML=[['falta','Falta ('+faltam().length+')'],['conf','Conferir ('+conferir().length+')'],['todos','Todos ('+produtos.length+')']].map(([k,t])=>`<button data-fl="${k}" class="${k===pFil?'on':''}">${t}</button>`).join('');
  $('#pFil').querySelectorAll('button').forEach(b=>b.onclick=()=>{pFil=b.dataset.fl;renderPrecos();$('#pBody').scrollTop=0});botaoPrecos()}
function renderPrecos(){
  gravaPendentes();filtros();
  const ok=p=>pFil==='todos'||(pFil==='falta'?!(p.preco>0):p.preco>0&&p.est), fmt=p=>p.preco>0?p.preco.toFixed(2).replace('.',','):'';
  const gs=porCat().map(g=>({...g,itens:g.itens.filter(ok)})).filter(g=>g.itens.length);
  $('#pBody').innerHTML='<p class="nota">'+(pFil==='falta'?'Escreva o preço: cada um é gravado na hora (✓ salvo). Sem preço, o produto não aparece para vender.':pFil==='conf'?'Estes preços são estimativa. Corrija, ou toque em ✓ se estiver certo.':'Mudar preço não altera o que já foi lançado.')+'</p>'+
   (gs.map(g=>`<div class="pc"><h4><span>${esc(g.e+' '+g.nome)}</span>${pFil==='falta'&&g.itens.length>1?`<button data-igual="${esc(g.id)}">mesmo preço p/ todos</button>`:''}</h4>${g.itens.map(p=>`<div class="pl${p.preco>0?'':' f'}"><span>${esc(p.nome)}${p.preco>0&&p.est?'<small>conferir</small>':''}</span>${p.preco>0&&p.est?`<button class="okk" data-ok="${p.id}" aria-label="Preço certo">✓</button>`:''}<em class="sv"></em><input data-pp="${p.id}" inputmode="decimal" enterkeyhint="next" placeholder="R$" aria-label="Preço de ${esc(p.nome)}" value="${fmt(p)}"></div>`).join('')}</div>`).join('')||'<p class="nota">✓ Nada pendente aqui.</p>');
  const ins=[...$('#pBody').querySelectorAll('[data-pp]')];
  ins.forEach((i,k)=>{
    /* grava sozinho enquanto digita (0,6 s parado), ao sair do campo e ao fechar o app */
    let t=null;const linha=i.closest('.pl'), p=produtos.find(x=>x.id===i.dataset.pp);if(!p)return;
    const grava=()=>{clearTimeout(t);t=null;const v=lerPreco(i.value);if(!(v>0))return false;
      if(p.preco===v&&!(p.est&&i.dataset.mexeu))return true;
      p.preco=v;delete p.est;const certo=salvar();filtros();linha.classList.remove('f');linha.querySelectorAll('small,.okk').forEach(x=>x.remove());
      if(certo)linha.querySelector('.sv').textContent='✓ salvo';return true};
    i.onfocus=()=>i.select();
    i.oninput=()=>{i.dataset.mexeu=1;linha.querySelector('.sv').textContent='';clearTimeout(t);t=setTimeout(grava,600)};
    i.onblur=()=>{if(!i.dataset.mexeu)return;if(!grava())toast(i.value.trim()?'Preço inválido: não mudou':'Vazio: não mudou',2000);i.value=fmt(p);delete i.dataset.mexeu};
    i._grava=()=>{if(t)grava()};
    i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ins[k+1]?ins[k+1].focus():i.blur()}};
  });
  $('#pBody').querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{const p=produtos.find(x=>x.id===b.dataset.ok);delete p.est;salvar();renderPrecos()});
  $('#pBody').querySelectorAll('[data-igual]').forEach(b=>b.onclick=()=>{
    const g=porCat().find(x=>x.id===b.dataset.igual), l=g?g.itens.filter(p=>!(p.preco>0)):[];
    const t=prompt('Preço para os '+l.length+' que faltam:\n'+l.map(p=>p.nome).join(', '));if(t===null)return;
    const v=lerPreco(t);if(!(v>0)){toast('Preço inválido',2000);return}l.forEach(p=>{p.preco=v;delete p.est});salvar();renderPrecos();toast(l.length+' preços salvos')});
}

  $('#pForm').innerHTML=`<div class="cx"><b>Novo produto</b><label>Nome (com o tamanho, se tiver mais de um)</label><input id="nNome" autocapitalize="words" autocomplete="off" placeholder="ex.: Doritos 75 g">
   <label>Preço</label><input id="nPreco" inputmode="decimal" placeholder="R$ (pode deixar para depois)">
   <label>Categoria</label><select id="nCat"><option value="">— escolha —</option>${cats.map(c=>`<option value="${esc(c.id)}">${esc(c.e+' '+c.nome)}</option>`).join('')}<option value="+">+ nova categoria</option></select>
   <div id="nCx" style="display:none"><label>Nome da nova categoria</label><input id="nCatN" autocapitalize="words"></div>
   <label>Foto (opcional)</label><input id="nFoto" type="file" accept="image/*">
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn b1" id="nX">Cancelar</button><button class="btn b3" id="nOk">Salvar</button></div></div>`;
  $('#nCat').onchange=()=>$('#nCx').style.display=$('#nCat').value==='+'?'':'none';

    if(cat==='+'){const j=cats.find(c=>normal(c.nome)===normal(cn));if(j)cat=j.id;else{cat=uid();cats.push({id:cat,e:'📦',nome:cn})}}
    produtos.push({id:uid(),e:'',nome,preco:v,cat,foto});salvar();$('#pForm').innerHTML='';renderPrecos();toast(v?nome+' cadastrado':nome+' salvo, falta o preço',2000)};
  $('#nNome').focus();
}
function linkPrecos(){
  const d={v:1,p:produtos.filter(p=>p.preco>0).map(p=>[p.id,p.preco,p.est?1:0,p.nome,p.cat||'']),c:cats.filter(c=>!CATS2.some(x=>x[0]===c.id)).map(c=>[c.id,c.e,c.nome])};
  return location.href.split('#')[0]+'#precos='+btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
$('#pEnviar').onclick=async()=>{
  gravaPendentes();
  const t='Preços do bar. Abra no outro celular para atualizar:\n'+linkPrecos();
  if(navigator.share){try{await navigator.share({text:t});return}catch(e){if(e&&e.name==='AbortError')return}}
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank','noopener');
};
/* o link vem de fora: só aceita id simples, preço numérico e texto curto; nada muda sem o OK */
function receberPrecos(){
  const m=location.hash.match(/precos=([A-Za-z0-9_-]+)/);if(!m)return;
  history.replaceState(null,'',location.pathname);
  let d;try{d=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));if(!Array.isArray(d.p))throw 0}catch(e){toast('Link de preços inválido',3000);return}
  const id=x=>typeof x==='string'&&/^[a-z0-9]{1,60}$/i.test(x), tx=x=>typeof x==='string'&&x.trim()&&x.length<=60;
  const l=d.p.filter(x=>Array.isArray(x)&&id(x[0])&&typeof x[1]==='number'&&x[1]>0&&x[1]<100000&&tx(x[3]));
  const acha=x=>produtos.find(p=>p.id===x[0])||produtos.find(p=>normal(p.nome)===normal(x[3]));
  const muda=l.filter(x=>{const p=acha(x);return p&&(p.preco!==x[1]||!!p.est!==!!x[2])}), novos=l.filter(x=>!acha(x));
  if(!muda.length&&!novos.length){toast('Os preços já estão iguais',3000);return}
  if(!confirm('Atualizar este celular?\n'+muda.length+' preços e '+novos.length+' produtos novos.\nAs contas não mudam.'))return;
  (Array.isArray(d.c)?d.c:[]).forEach(c=>{if(Array.isArray(c)&&id(c[0])&&tx(c[2])&&!cats.some(k=>k.id===c[0]))cats.push({id:c[0],e:String(c[1]||'📦').slice(0,8),nome:c[2].trim()})});
  muda.forEach(x=>{const p=acha(x);p.preco=x[1];if(x[2])p.est=true;else delete p.est});
  novos.forEach(x=>{const p={id:x[0],e:'',nome:x[3].trim(),preco:x[1],cat:cats.some(c=>c.id===x[4])?x[4]:'',foto:''};if(x[2])p.est=true;produtos.push(p)});
  salvar();render();botaoPrecos();if(aberta)renderConta();if($('#precos').classList.contains('on'))renderPrecos();toast('Preços atualizados',3000);
}

/* ===== ENTRADA PRONTA (lida de foto da nota/pedido) =====
 Chega pelo link  ...#entrada=<base64url de {"itens":[{"nome":"Brahma lata","q":48,"custo":120}]}>
 O dono só confere e confirma: nada entra no estoque sem o OK dele. */
function acharProduto(nome){
  const n=normal(nome);let melhor=null,pts=0;
  produtos.forEach(p=>{const pn=normal(p.nome);if(!pn)return;
    let s=0;if(n===pn)s=100;else if(n.includes(pn)||pn.includes(n))s=60;
    else{const a=new Set(n.split(' ')),b=pn.split(' ');s=b.filter(w=>w.length>2&&a.has(w)).length*20}
    if(s>pts){pts=s;melhor=p}});
  return pts>=20?melhor:null;
}
function lerEntrada(){
  const m=location.hash.match(/entrada=([A-Za-z0-9_-]+)/);if(!m)return null;
  try{const b=m[1].replace(/-/g,'+').replace(/_/g,'/');const txt=decodeURIComponent(escape(atob(b+'==='.slice((b.length+3)%4))));
    const d=JSON.parse(txt);return Array.isArray(d.itens)?d:null}catch(e){return null}
}
async function abrirEntrada(d){
  history.replaceState(null,'',location.pathname);
  if(!await pedirPin())return;
  donoAba='estoque';$('#dono').classList.add('on');renderDono();
  const linhas=d.itens.map((it,i)=>{const p=acharProduto(it.nome);
    return `<div style="border-bottom:1px solid #e7e2cf;padding:8px 0"><div style="font-size:14px;color:#666">Na nota: <b>${esc(it.nome)}</b></div>
     <select data-ei="${i}" style="margin-top:4px"><option value="">— não lançar —</option>${optsProd(p&&p.id)}<option value="novo">+ criar produto "${esc(it.nome)}"</option></select>
     <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px"><input data-eq="${i}" inputmode="numeric" value="${+it.q||''}" placeholder="unidades"><input data-ev="${i}" inputmode="decimal" value="${it.custo?String(it.custo).replace('.',','):''}" placeholder="R$ total"></div></div>`}).join('');
  $('#eForm').innerHTML=`<div class="cx"><b>Conferir mercadoria da foto</b><p class="nota" style="margin-top:2px">Confira se o produto e a quantidade em <b>unidades</b> estão certos (fardo de 12 = 12). Só entra no estoque quando tocar em Confirmar.</p>${linhas}
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn b1" id="iX">Cancelar</button><button class="btn b3" id="iOk">Confirmar entrada</button></div></div>`;
  $('#iX').onclick=()=>$('#eForm').innerHTML='';
  $('#iOk').onclick=()=>{const agora=Date.now();let n=0;
    d.itens.forEach((it,i)=>{let pid=$(`[data-ei="${i}"]`).value;const q=parseInt($(`[data-eq="${i}"]`).value,10);
      const v=parseFloat(($(`[data-ev="${i}"]`).value||'').replace(/\./g,'').replace(',','.'));
      if(!pid||!(q>0))return;
      if(pid==='novo'){const np={id:uid(),e:'',nome:cap(String(it.nome).trim()),preco:0,cat:''};produtos.push(np);pid=np.id}
      const p=produtos.find(x=>x.id===pid);const m={id:uid(),tipo:'compra',p:pid,q,t:agora};if(v>0){m.custo=v;p.custo=v/q}
      mov.push(m);n++});
    if(!n){toast('Nada para lançar');return}
    ultimaDif=`<div class="dif"><b>${n} produto(s) lançados</b> pela foto.${produtos.some(p=>!p.preco)?' Tem produto novo sem preço de venda: acerte em "💲 Preços" na tela inicial.':''}</div>`;
    salvar();renderEstoque();toast('Entrada lançada')};
}
{const d=lerEntrada();if(d)setTimeout(()=>abrirEntrada(d),300)}
