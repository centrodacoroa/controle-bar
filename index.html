<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1f5c3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Controle de Bar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fdfbf3;color:#1d1d1b}
button{font-family:inherit}
.top{position:sticky;top:0;z-index:5;background:#fdfbf3;padding:10px 12px 8px;border-bottom:2px solid #e0c9c9}
.cab{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cab b{font-size:17px}
.cab .res{font-size:13px;color:#666;flex:1;text-align:right}
.ic{border:1px solid #ddd;background:#fff;border-radius:10px;font-size:14px;padding:6px 10px;color:#333}
#nome{width:100%;font-size:20px;padding:14px;border:2px solid #1f5c3a;border-radius:12px;background:#fff}
.novo{display:none;width:100%;margin-top:8px;border:0;border-radius:12px;padding:14px;font-size:18px;font-weight:700;background:#1f5c3a;color:#fff}
.dup{display:none;margin-top:8px;background:#fff3cd;border:1px solid #e8d48a;border-radius:12px;padding:10px}
.dup p{margin:0 0 8px;font-size:16px}
.dup .bt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dup input{width:100%;font-size:17px;padding:10px;border:1px solid #ccc;border-radius:10px;margin-top:8px}
.folha{max-width:720px;margin:0 auto;background:repeating-linear-gradient(#fdfbf3 0 55px,#c9d8ea 55px 56px)}
.linha{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 12px 6px 18px;border-left:2px solid #e0a3a3;margin-left:28px;cursor:pointer}
.linha .n{font-size:19px;font-weight:700;min-width:0;flex:1}
.linha .r{display:block;font-size:13px;font-weight:400;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha .v{font-size:19px;font-weight:700;color:#1f5c3a;white-space:nowrap}
.linha.pago{opacity:.5}
.linha.pago .n,.linha.pago .v{text-decoration:line-through;color:#555}
.linha.dev .v{color:#b3261e}
.sep{margin-left:28px;padding:10px 18px 4px;border-left:2px solid #e0a3a3;font-size:13px;color:#888;text-transform:uppercase}
.sep.dev{color:#b3261e;cursor:pointer}
.vazio{margin-left:28px;border-left:2px solid #e0a3a3;padding:20px 18px;color:#888;min-height:200px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}
.sheet.on{display:block}
.panel{position:absolute;left:0;right:0;bottom:0;top:30px;background:#fff;border-radius:18px 18px 0 0;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.ph{padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee}
.ph h2{margin:0;font-size:24px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph .t{font-size:24px;font-weight:800;color:#1f5c3a}
.pb{flex:1;overflow:auto;padding:12px}
.aviso{background:#fbe3e1;color:#7a1712;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.aviso.ok{background:#e3f1e8;color:#1f5c3a}
.lista{margin:0 0 14px;background:#f6f3e6;border-radius:12px;padding:8px 12px;font-size:16px;color:#444}
.pg{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #e7e2cf}.pg:last-child{border-bottom:0}.pg span{flex:1}
.qq{font-size:20px;color:#1f5c3a}
.novo1{animation:pisca 1s}@keyframes pisca{0%{background:#bfe3cc}100%{background:transparent}}
.menos{border:0;background:#fbe3e1;color:#b3261e;border-radius:10px;padding:8px 12px;font-size:15px;font-weight:700}
.prods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prod{border:2px solid #e4e4de;border-radius:14px;background:#fafaf7;padding:10px 4px;font-size:15px;font-weight:700;min-height:86px;position:relative;color:#1d1d1b}
.prod .e{display:block;font-size:26px}
.prod .p{display:block;font-weight:400;color:#1f5c3a;font-size:14px}
.prod .q{position:absolute;top:-8px;right:-6px;background:#1f5c3a;color:#fff;border-radius:12px;min-width:24px;padding:2px 6px;font-size:14px}
.prod:active{background:#d7eadf;transform:scale(.97)}
.pf{display:grid;grid-template-columns:2fr 1fr;gap:8px;padding:10px 12px 16px;border-top:1px solid #eee}
.pf button,.btn{border:0;border-radius:12px;padding:16px 6px;font-size:17px;font-weight:700}
.b1{background:#eee;color:#333}.b2{background:#fbe3e1;color:#b3261e}.b3{background:#1f5c3a;color:#fff}.b4{background:#1a73c9;color:#fff}
.fechar{display:none;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 0}
.fechar.on{display:grid}
.fechar .w{grid-column:1/3}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#1d1d1b;color:#fff;padding:10px 18px;border-radius:20px;font-size:16px;opacity:0;transition:.15s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
.dono table{width:100%;border-collapse:collapse}.dono td{padding:6px;border-bottom:1px solid #eee}
.dono input{font-size:16px;padding:8px;border:1px solid #ccc;border-radius:8px;width:100%}
.res-dia{font-size:16px;line-height:1.5}
.res-dia h3{font-size:14px;text-transform:uppercase;color:#888;margin:16px 0 4px}
.res-dia .l{display:flex;justify-content:space-between;border-bottom:1px solid #f0f0f0;padding:4px 0}
.res-dia .big{font-size:22px;font-weight:800}
a.btn{display:block;text-align:center;text-decoration:none}
</style>
</head>
<body>
<div class="top">
  <div class="cab"><b id="dia"></b><span class="res" id="res"></span><button class="ic" id="bResumo">Fechar dia</button><button class="ic" id="bDono">⚙︎</button></div>
  <input id="nome" placeholder="Escreva o nome…" autocomplete="off" autocapitalize="words">
  <button class="novo" id="novo"></button>
  <div class="dup" id="dup"></div>
</div>
<div class="folha" id="folha"></div>

<div class="sheet" id="sheet"><div class="panel">
  <div class="ph"><h2 id="sNome"></h2><span class="t" id="sTot"></span></div>
  <div class="pb" id="sBody"></div>
  <div class="fechar" id="fechar"></div>
  <div class="pf"><button class="b3" id="bVolta">✓ Pronto</button><button class="b1" id="bFechar" style="font-size:15px;font-weight:600">Fechar conta</button></div>
</div></div>

<div class="sheet" id="resumo"><div class="panel">
  <div class="ph"><h2>Resumo do dia</h2></div>
  <div class="pb res-dia" id="rBody"></div>
  <div class="pf" style="grid-template-columns:1fr 1fr"><button class="b1" id="rVolta">Voltar</button><a class="btn b3" id="rZap" href="#" target="_blank" rel="noopener">Enviar no WhatsApp</a><button class="b4" id="rBk" style="grid-column:1/3">Enviar backup do dia</button></div>
</div></div>

<div class="sheet" id="dono"><div class="panel">
  <div class="ph"><h2>Produtos e preços</h2></div>
  <div class="pb dono" id="dBody"></div>
  <div class="pf" style="grid-template-columns:1fr 1fr"><button class="b1" id="dVolta">Fechar</button><button class="b3" id="dAdd">+ Produto</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const brl=v=>'R$ '+(v||0).toFixed(2).replace('.',',');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hoje=()=>dstr(new Date());
const dbr=s=>s.slice(8,10)+'/'+s.slice(5,7);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1000)}

/* ===== Dados =====
 contas: todas as contas, de todos os dias (histórico completo).
 conta = {id,nome,dia,itens:[{p,nome,preco,t}],status:'aberta'|'paga'|'devendo',forma:'pix'|'dinheiro',pagoDia,t}
 Uma conta "devendo" continua aparecendo nos dias seguintes até ser paga. */
let produtos=[
 {id:'p1',e:'🍺',nome:'Cerveja lata',preco:6},{id:'p2',e:'🍻',nome:'Cerveja 600',preco:12},{id:'p3',e:'🥤',nome:'Refri lata',preco:5},
 {id:'p4',e:'💧',nome:'Água',preco:3},{id:'p5',e:'🥟',nome:'Coxinha',preco:7},{id:'p6',e:'🍟',nome:'Salgadinho',preco:5},
 {id:'p7',e:'🍬',nome:'Bala',preco:0.5},{id:'p8',e:'🍫',nome:'Chocolate',preco:4},{id:'p9',e:'🍦',nome:'Sorvete',preco:8},
 {id:'p10',e:'🍭',nome:'Pirulito',preco:1},{id:'p11',e:'⚡',nome:'Energético',preco:10},{id:'p12',e:'🌭',nome:'Cachorro-quente',preco:9}];
let contas=[], aberta=null, db=null, ultimo=null, ultimoT=0, verDevendo=false;
let dia=hoje();

const LS='bar_v2';
function salvarLocal(){try{localStorage.setItem(LS,JSON.stringify({produtos,contas}))}catch(e){}}
function carregarLocal(){try{const s=JSON.parse(localStorage.getItem(LS)||'null');if(s){produtos=s.produtos||produtos;contas=s.contas||[]}}catch(e){}}
let tmr=null;
function salvar(){salvarLocal();if(!db)return;clearTimeout(tmr);tmr=setTimeout(()=>{
  db.collection('bar').doc('estado').set({json:JSON.stringify({produtos,contas}),t:Date.now()}).catch(()=>{});
},500)}
carregarLocal();

const total=c=>c.itens.reduce((s,i)=>s+i.preco,0);
function agrupa(itens){const m={};itens.forEach(i=>{m[i.p]=m[i.p]||{nome:i.nome,q:0,v:0};m[i.p].q++;m[i.p].v+=i.preco});return m}
const resumo=c=>Object.values(agrupa(c.itens)).map(x=>x.q+' '+x.nome).join(', ')||'nada ainda';
const doDia=()=>contas.filter(c=>c.dia===dia);
const devendo=()=>contas.filter(c=>c.status==='devendo');

function render(){
  if(hoje()!==dia){dia=hoje()}
  $('#dia').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
  const ab=doDia().filter(c=>c.status==='aberta');
  const rec=contas.filter(c=>c.status==='paga'&&c.pagoDia===dia).reduce((s,c)=>s+total(c),0);
  $('#res').textContent=`Aberto ${brl(ab.reduce((s,c)=>s+total(c),0))} · Recebido ${brl(rec)}`;
  const q=$('#nome').value.trim().toLowerCase(), f=c=>!q||c.nome.toLowerCase().includes(q);
  const linha=(c,cls)=>`<div class="linha ${cls}" data-id="${c.id}"><span class="n">${esc(c.nome)}<span class="r">${cls==='dev'?'devendo desde '+dbr(c.dia)+' · ':''}${esc(resumo(c))}</span></span><span class="v">${brl(total(c))}</span></div>`;
  const a=ab.filter(f).sort((x,y)=>y.t-x.t);
  const pg=doDia().filter(c=>c.status==='paga'&&f(c));
  const dv=devendo().filter(f);
  let h=a.map(c=>linha(c,'')).join('');
  if(dv.length){
    const totDv=dv.reduce((s,c)=>s+total(c),0);
    if(q||verDevendo)h+=`<div class="sep dev" id="sepDev">Devendo · ${dv.length} · ${brl(totDv)}${q?'':' ▲'}</div>`+dv.map(c=>linha(c,'dev')).join('');
    else h+=`<div class="sep dev" id="sepDev">Devendo · ${dv.length} pessoa(s) · ${brl(totDv)} ▼ ver</div>`;
  }
  if(pg.length)h+=`<div class="sep">Pagos hoje</div>`+pg.map(c=>linha(c,'pago')).join('');
  $('#folha').innerHTML=h||`<div class="vazio">${q?'Ninguém com esse nome hoje.':'Folha em branco. Escreva o primeiro nome lá em cima.'}</div>`;
  if(h&&!q)$('#folha').insertAdjacentHTML('beforeend','<div class="vazio" style="min-height:120px"></div>');
  $('#folha').querySelectorAll('.linha').forEach(l=>l.onclick=()=>abrir(l.dataset.id));
  const sd=$('#sepDev');if(sd&&!q)sd.onclick=()=>{verDevendo=!verDevendo;render()};
  const exato=ab.some(c=>c.nome.toLowerCase()===q);
  const b=$('#novo');b.style.display=q&&!exato?'block':'none';b.textContent='+ Novo: '+cap($('#nome').value.trim());
  if(!q)$('#dup').style.display='none';
}

/* ----- criar conta, com checagem de nome repetido ----- */
function criar(){
  const n=cap($('#nome').value.trim());if(!n)return;
  const iguais=doDia().filter(c=>c.status==='aberta'&&c.nome.toLowerCase()===n.toLowerCase());
  const dev=devendo().filter(c=>c.nome.toLowerCase()===n.toLowerCase());
  if(iguais.length||dev.length){perguntarDup(n,iguais,dev);return}
  novaConta(n);
}
function perguntarDup(n,iguais,dev){
  const d=$('#dup');d.style.display='block';
  const ex=iguais[0];
  d.innerHTML=`<p>${ex?`Já tem <b>${esc(n)}</b> aberto hoje (${brl(total(ex))}).`:''}${dev.length?` <b>${esc(n)}</b> está devendo ${brl(dev.reduce((s,c)=>s+total(c),0))}.`:''} É a mesma pessoa?</p>
   <div class="bt">${ex?`<button class="btn b3" id="dMesmo">Sim, abrir</button>`:`<button class="btn b3" id="dMesmo">Sim, nova conta</button>`}<button class="btn b1" id="dOutro">Não, é outro</button></div>
   <input id="dApel" placeholder="Apelido: ex. ${esc(n)} goleiro" style="display:none" autocapitalize="words">`;
  $('#dMesmo').onclick=()=>{d.style.display='none';ex?abrir(ex.id):novaConta(n)};
  $('#dOutro').onclick=()=>{const i=$('#dApel');i.style.display='block';i.value=n+' ';i.focus();$('#dOutro').textContent='Criar';
    $('#dOutro').onclick=()=>{const v=cap(i.value.trim());if(!v||v.toLowerCase()===n.toLowerCase()){toast('Escreva um apelido');return}d.style.display='none';novaConta(v)};
    i.onkeydown=e=>{if(e.key==='Enter')$('#dOutro').click()}};
}
function novaConta(n){const c={id:uid(),nome:n,dia,itens:[],status:'aberta',t:Date.now()};contas.push(c);salvar();abrir(c.id)}

/* ----- conta aberta ----- */
function abrir(id){ultimo=null;aberta=contas.find(c=>c.id===id);$('#dup').style.display='none';$('#fechar').classList.remove('on');$('#sheet').classList.add('on');renderConta()}
function renderConta(){
  const c=aberta, g=agrupa(c.itens), trav=c.status!=='aberta';
  $('#sNome').textContent=c.nome;$('#sTot').textContent=brl(total(c));
  let h='';
  const outras=devendo().filter(x=>x.id!==c.id&&x.nome.toLowerCase()===c.nome.toLowerCase());
  if(outras.length&&c.status==='aberta')h+=`<div class="aviso">⚠︎ ${esc(c.nome)} está devendo ${brl(outras.reduce((s,x)=>s+total(x),0))} de ${outras.map(x=>dbr(x.dia)).join(', ')}. <u data-ab="${outras[0].id}">Ver</u></div>`;
  if(c.status==='devendo')h+=`<div class="aviso">Ficou devendo desde ${dbr(c.dia)}. Quando pagar, toque em "Fechar conta".</div>`;
  if(c.status==='paga')h+=`<div class="aviso ok">Paga em ${dbr(c.pagoDia)} no ${c.forma==='pix'?'Pix':'dinheiro'}.</div>`;
  h+=`<div class="lista"><b>Pegou:</b>${Object.keys(g).length?Object.entries(g).map(([pid,x])=>`<div class="pg${pid===ultimo?' novo1':''}"><span><b class="qq">${x.q}×</b> ${esc(x.nome)}</span><b>${brl(x.v)}</b>${trav?'':`<button class="menos" data-m="${pid}">− tirar 1</button>`}</div>`).join(''):' <span style="color:#888">nada ainda</span>'}</div>`;
  if(!trav){const cont={};c.itens.forEach(i=>cont[i.p]=(cont[i.p]||0)+1);
    h+=`<div class="prods">${produtos.map(p=>`<button class="prod" data-p="${p.id}"><span class="e">${p.e||'•'}</span>${esc(p.nome)}<span class="p">${brl(p.preco)}</span>${cont[p.id]?`<span class="q">${cont[p.id]}</span>`:''}</button>`).join('')}</div>`}
  $('#sBody').innerHTML=h;
  $('#sBody').querySelectorAll('[data-ab]').forEach(u=>u.onclick=()=>abrir(u.dataset.ab));
  $('#sBody').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    const agora=Date.now();
    if(b.dataset.p===ultimo&&agora-ultimoT<800){toast('Toque duplo ignorado');return}
    ultimo=b.dataset.p;ultimoT=agora;
    const p=produtos.find(x=>x.id===b.dataset.p);c.itens.push({p:p.id,nome:p.nome,preco:p.preco,t:agora});c.t=agora;
    salvar();renderConta();toast('+1 '+p.nome);if(navigator.vibrate)navigator.vibrate(20);
  });
  $('#sBody').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    const k=c.itens.map(i=>i.p).lastIndexOf(b.dataset.m);if(k<0)return;const it=c.itens.splice(k,1)[0];ultimo=null;salvar();renderConta();toast('Tirou 1 '+it.nome);
  });
  $('#bFechar').textContent=c.status==='paga'?'Reabrir':'Fechar conta';
  $('#bFechar').style.display=(c.status==='aberta'&&!c.itens.length)?'none':'';
}
$('#bVolta').onclick=()=>{
  const c=aberta;if(c&&c.status==='aberta'&&!c.itens.length){contas=contas.filter(x=>x!==c);salvar()}
  $('#sheet').classList.remove('on');aberta=null;$('#nome').value='';render()};
$('#bFechar').onclick=()=>{
  const c=aberta,f=$('#fechar');
  if(c.status==='paga'){c.status=c.forma=c.pagoDia=undefined;c.status='aberta';delete c.forma;delete c.pagoDia;salvar();toast('Reaberta');renderConta();return}
  if(f.classList.contains('on')){f.classList.remove('on');return}
  f.innerHTML=`<button class="btn b4" data-f="pix">Pix ${brl(total(c))}</button><button class="btn b3" data-f="dinheiro">Dinheiro ${brl(total(c))}</button>${c.status==='aberta'?'<button class="btn b2 w" data-f="dev">Ficou devendo</button>':''}`;
  f.classList.add('on');
  f.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.f;
    if(k==='dev'){c.status='devendo';toast(c.nome+' ficou devendo')}
    else{c.status='paga';c.forma=k;c.pagoDia=dia;toast(c.nome+' pagou no '+(k==='pix'?'Pix':'dinheiro'))}
    salvar();f.classList.remove('on');$('#bVolta').onclick();
  });
};
$('#nome').oninput=()=>{$('#dup').style.display='none';render()};
$('#nome').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();criar()}};
$('#novo').onclick=criar;

/* ----- resumo / fechar o dia ----- */
function textoResumo(){
  const pagosHoje=contas.filter(c=>c.status==='paga'&&c.pagoDia===dia);
  const pix=pagosHoje.filter(c=>c.forma==='pix').reduce((s,c)=>s+total(c),0);
  const din=pagosHoje.filter(c=>c.forma==='dinheiro').reduce((s,c)=>s+total(c),0);
  const fiadoRec=pagosHoje.filter(c=>c.dia!==dia).reduce((s,c)=>s+total(c),0);
  const hojeC=doDia(), vend=hojeC.reduce((s,c)=>s+total(c),0);
  const abertas=hojeC.filter(c=>c.status==='aberta');
  const novoDev=hojeC.filter(c=>c.status==='devendo');
  const dvTot=devendo().reduce((s,c)=>s+total(c),0);
  const g={};hojeC.forEach(c=>c.itens.forEach(i=>{g[i.nome]=g[i.nome]||{q:0,v:0};g[i.nome].q++;g[i.nome].v+=i.preco}));
  const prods=Object.entries(g).sort((a,b)=>b[1].q-a[1].q);
  return {pix,din,fiadoRec,vend,abertas,novoDev,dvTot,prods,n:hojeC.length};
}
function abrirResumo(){
  const r=textoResumo();
  const l=(a,b,cls='')=>`<div class="l ${cls}"><span>${a}</span><b>${b}</b></div>`;
  let h='';
  if(r.abertas.length)h+=`<div class="aviso">⚠︎ Ainda tem ${r.abertas.length} conta(s) aberta(s): ${r.abertas.map(c=>esc(c.nome)).join(', ')}. Feche ou marque "ficou devendo".</div>`;
  h+=`<h3>Caixa</h3>${l('Pix',brl(r.pix))}${l('Dinheiro',brl(r.din))}${l('Total recebido',brl(r.pix+r.din),'big')}`;
  if(r.fiadoRec)h+=`<div style="font-size:14px;color:#666">inclui ${brl(r.fiadoRec)} de dívidas antigas pagas hoje</div>`;
  h+=`<h3>Vendas de hoje</h3>${l('Clientes',r.n)}${l('Vendido',brl(r.vend))}${l('Ficou devendo hoje',brl(r.novoDev.reduce((s,c)=>s+total(c),0)))}${l('Total devendo (todos os dias)',brl(r.dvTot))}`;
  h+=`<h3>Por produto</h3>${r.prods.map(([n,x])=>l(x.q+'× '+esc(n),brl(x.v))).join('')||'<div style="color:#888">nada vendido</div>'}`;
  $('#rBody').innerHTML=h;
  const t=`*Bar - resumo ${new Date().toLocaleDateString('pt-BR')}*\nPix: ${brl(r.pix)}\nDinheiro: ${brl(r.din)}\n*Recebido: ${brl(r.pix+r.din)}*\nVendido hoje: ${brl(r.vend)} (${r.n} clientes)\nFicou devendo hoje: ${brl(r.novoDev.reduce((s,c)=>s+total(c),0))}${r.novoDev.length?' ('+r.novoDev.map(c=>c.nome).join(', ')+')':''}\nTotal devendo: ${brl(r.dvTot)}\n\n*Produtos*\n${r.prods.map(([n,x])=>x.q+'x '+n+' = '+brl(x.v)).join('\n')}`;
  $('#rZap').href='https://wa.me/?text='+encodeURIComponent(t);
  $('#resumo').classList.add('on');
}
$('#bResumo').onclick=abrirResumo;
$('#rVolta').onclick=()=>$('#resumo').classList.remove('on');

/* ----- área do dono ----- */
function renderDono(){
  $('#dBody').innerHTML=`<p style="color:#666;font-size:14px">Mudar preço não altera o que já foi lançado.</p><table>${produtos.map((p,i)=>`<tr><td style="width:50px"><input data-i="${i}" data-k="e" value="${esc(p.e||'')}"></td><td><input data-i="${i}" data-k="nome" value="${esc(p.nome)}"></td><td style="width:90px"><input data-i="${i}" data-k="preco" inputmode="decimal" value="${p.preco.toFixed(2).replace('.',',')}"></td><td style="width:40px"><button class="b2" style="border:0;border-radius:8px;padding:8px" data-x="${i}">✕</button></td></tr>`).join('')}</table>`;
  $('#dBody').querySelectorAll('input').forEach(inp=>inp.onchange=()=>{const p=produtos[inp.dataset.i];
    if(inp.dataset.k==='preco'){const v=parseFloat(inp.value.replace(',','.'));if(!isNaN(v))p.preco=v}else p[inp.dataset.k]=inp.value.trim();salvar();toast('Salvo')});
  $('#dBody').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{if(!b.dataset.ok){b.dataset.ok=1;b.textContent='?';return}produtos.splice(+b.dataset.x,1);salvar();renderDono()});
  $('#dBody').insertAdjacentHTML('beforeend',`<h3 style="margin:22px 0 6px;font-size:14px;color:#888;text-transform:uppercase">Segurança dos dados</h3>
   <p style="color:#666;font-size:14px;margin:0 0 8px">Último backup enviado: <b>${ultimoBk()||'nunca'}</b>. Guarde o arquivo no WhatsApp ou no Drive: se o celular sumir, é com ele que se recupera tudo.</p>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <button class="btn b4" id="dBk">Enviar backup</button>
    <button class="btn b1" id="dRest">Restaurar backup</button>
    <button class="btn b1" id="dPin" style="grid-column:1/3">Trocar PIN</button></div>
   <input type="file" id="dArq" accept=".json,application/json" style="display:none">`);
  $('#dBk').onclick=enviarBackup;
  $('#dRest').onclick=()=>$('#dArq').click();
  $('#dArq').onchange=e=>{const f=e.target.files[0];if(f)restaurar(f)};
  $('#dPin').onclick=()=>{try{localStorage.removeItem(PINK)}catch(e){}pedirPin()};
}

/* ----- backup: arquivo .json com tudo (produtos + histórico completo) ----- */
const BKK='bar_ultimo_backup';
const ultimoBk=()=>{try{return localStorage.getItem(BKK)}catch(e){return null}};
async function enviarBackup(){
  const nome='bar-backup-'+hoje()+'.json';
  const txt=JSON.stringify({app:'controle-bar',versao:2,gerado:new Date().toISOString(),produtos,contas});
  const arq=new File([txt],nome,{type:'application/json'});
  const marca=()=>{try{localStorage.setItem(BKK,new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}))}catch(e){}if($('#dono').classList.contains('on'))renderDono()};
  try{
    if(navigator.canShare&&navigator.canShare({files:[arq]})){await navigator.share({files:[arq],title:nome});marca();toast('Backup enviado');return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(arq);a.download=nome;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);marca();toast('Backup baixado');
}
function restaurar(f){
  const r=new FileReader();
  r.onload=()=>{try{
    const s=JSON.parse(r.result);if(s.app!=='controle-bar'||!Array.isArray(s.contas))throw 0;
    if(!confirm(`Restaurar backup de ${new Date(s.gerado).toLocaleString('pt-BR')}?\n${s.contas.length} contas. O que está no celular agora será substituído.`))return;
    salvarCopiaSeguranca();
    contas=s.contas;produtos=s.produtos||produtos;salvar();renderDono();render();toast('Backup restaurado');
  }catch(e){toast('Arquivo de backup inválido')}};
  r.readAsText(f);
}
/* cópia automática no próprio celular: guarda o estado de antes de cada dia novo (últimos 7) */
function salvarCopiaSeguranca(){try{
  const k='bar_copia_'+hoje();localStorage.setItem(k,JSON.stringify({produtos,contas}));
  Object.keys(localStorage).filter(x=>x.startsWith('bar_copia_')).sort().slice(0,-7).forEach(x=>localStorage.removeItem(x));
}catch(e){}}
$('#rBk').onclick=enviarBackup;
/* ----- PIN da área do dono (guardado só como hash; impede mexida casual, não é cofre) ----- */
const PINK='bar_pin';
async function hashPin(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bar:'+p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function pedirPin(){
  let salvo=null;try{salvo=localStorage.getItem(PINK)}catch(e){}
  if(!salvo){
    const p1=prompt('Crie um PIN de 4 números para a área do dono:');if(p1===null)return false;
    if(!/^\d{4}$/.test(p1)){toast('O PIN precisa ter 4 números');return false}
    const p2=prompt('Repita o PIN:');if(p2!==p1){toast('PINs diferentes');return false}
    try{localStorage.setItem(PINK,await hashPin(p1))}catch(e){}
    toast('PIN criado');return true}
  const p=prompt('PIN do dono:');if(p===null)return false;
  if(await hashPin(p)===salvo)return true;toast('PIN errado');return false}
$('#bDono').onclick=async()=>{if(!await pedirPin())return;$('#dono').classList.add('on');renderDono()};
$('#dVolta').onclick=()=>{$('#dono').classList.remove('on');render()};
$('#dAdd').onclick=()=>{produtos.push({id:uid(),e:'',nome:'Novo produto',preco:0});salvar();renderDono()};

setInterval(()=>{if(hoje()!==dia&&!aberta)render()},60000);
render();

/* proteção dos dados no aparelho */
try{if(!localStorage.getItem('bar_copia_'+hoje()))salvarCopiaSeguranca()}catch(e){}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
/* funcionar sem internet */
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

/* cópia na nuvem (quando aberto dentro do Claude) */
(async()=>{try{
  if(typeof claude==='undefined')return;
  db=await claude.use('db');if(!db)return;
  const d=await db.collection('bar').doc('estado').get();const dd=d&&(typeof d.data==='function'?d.data():d);
  if(dd&&dd.json){const s=JSON.parse(dd.json);if((s.contas||[]).length>=contas.length){contas=s.contas;produtos=s.produtos||produtos;salvarLocal();render()}}
  else salvar();
}catch(e){}})();
