<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1f5c3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Controle de Bar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fdfbf3;color:#1d1d1b}
button{font-family:inherit}
.top{position:sticky;top:0;z-index:5;background:#fdfbf3;padding:10px 12px 8px;border-bottom:2px solid #e0c9c9}
.cab{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cab b{font-size:17px}
.cab .res{font-size:13px;color:#666;flex:1;text-align:right}
.ic{border:1px solid #ddd;background:#fff;border-radius:10px;font-size:14px;padding:6px 10px;color:#333}
#nome{width:100%;font-size:20px;padding:14px;border:2px solid #1f5c3a;border-radius:12px;background:#fff}
.novo{display:none;width:100%;margin-top:8px;border:0;border-radius:12px;padding:14px;font-size:18px;font-weight:700;background:#1f5c3a;color:#fff}
.dup{display:none;margin-top:8px;background:#fff3cd;border:1px solid #e8d48a;border-radius:12px;padding:10px}
.dup p{margin:0 0 8px;font-size:16px}
.dup .bt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dup input{width:100%;font-size:17px;padding:10px;border:1px solid #ccc;border-radius:10px;margin-top:8px}
.folha{max-width:720px;margin:0 auto;background:repeating-linear-gradient(#fdfbf3 0 55px,#c9d8ea 55px 56px)}
.linha{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 12px 6px 18px;border-left:2px solid #e0a3a3;margin-left:28px;cursor:pointer}
.linha .n{font-size:19px;font-weight:700;min-width:0;flex:1}
.linha .r{display:block;font-size:13px;font-weight:400;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha .v{font-size:19px;font-weight:700;color:#1f5c3a;white-space:nowrap}
.linha.pago{opacity:.5}
.linha.pago .n,.linha.pago .v{text-decoration:line-through;color:#555}
.linha.dev .v{color:#b3261e}
.sep{margin-left:28px;padding:10px 18px 4px;border-left:2px solid #e0a3a3;font-size:13px;color:#888;text-transform:uppercase}
.sep.dev{color:#b3261e;cursor:pointer}
.vazio{margin-left:28px;border-left:2px solid #e0a3a3;padding:20px 18px;color:#888;min-height:200px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}
.sheet.on{display:block}
.panel{position:absolute;left:0;right:0;bottom:0;top:30px;background:#fff;border-radius:18px 18px 0 0;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.ph{padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee}
.ph h2{margin:0;font-size:24px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph .t{font-size:24px;font-weight:800;color:#1f5c3a}
.pb{flex:1;overflow:auto;padding:12px}
.aviso{background:#fbe3e1;color:#7a1712;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.aviso.ok{background:#e3f1e8;color:#1f5c3a}
.lista{margin:0 0 14px;background:#f6f3e6;border-radius:12px;padding:8px 12px;font-size:16px;color:#444}
.pg{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #e7e2cf}.pg:last-child{border-bottom:0}.pg span{flex:1}
.qq{font-size:20px;color:#1f5c3a}
.novo1{animation:pisca 1s}@keyframes pisca{0%{background:#bfe3cc}100%{background:transparent}}
.menos{border:0;background:#fbe3e1;color:#b3261e;border-radius:10px;padding:8px 12px;font-size:15px;font-weight:700}
.prods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prod{border:2px solid #e4e4de;border-radius:14px;background:#fafaf7;padding:10px 4px;font-size:15px;font-weight:700;min-height:86px;position:relative;color:#1d1d1b}
.prod .e{display:block;font-size:26px}
.prod .p{display:block;font-weight:400;color:#1f5c3a;font-size:14px}
.prod .q{position:absolute;top:-8px;right:-6px;background:#1f5c3a;color:#fff;border-radius:12px;min-width:24px;padding:2px 6px;font-size:14px}
.prod:active{background:#d7eadf;transform:scale(.97)}
.pf{display:grid;grid-template-columns:2fr 1fr;gap:8px;padding:10px 12px 16px;border-top:1px solid #eee}
.pf button,.btn{border:0;border-radius:12px;padding:16px 6px;font-size:17px;font-weight:700}
.b1{background:#eee;color:#333}.b2{background:#fbe3e1;color:#b3261e}.b3{background:#1f5c3a;color:#fff}.b4{background:#1a73c9;color:#fff}
.fechar{display:none;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 0}
.fechar.on{display:grid}
.fechar .w{grid-column:1/3}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#1d1d1b;color:#fff;padding:10px 18px;border-radius:20px;font-size:16px;opacity:0;transition:.15s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
.dono table{width:100%;border-collapse:collapse}.dono td{padding:6px;border-bottom:1px solid #eee}
.dono input{font-size:16px;padding:8px;border:1px solid #ccc;border-radius:8px;width:100%}
.res-dia{font-size:16px;line-height:1.5}
.res-dia h3{font-size:14px;text-transform:uppercase;color:#888;margin:16px 0 4px}
.res-dia .l{display:flex;justify-content:space-between;border-bottom:1px solid #f0f0f0;padding:4px 0}
.res-dia .big{font-size:22px;font-weight:800}
a.btn{display:block;text-align:center;text-decoration:none}
.abas{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 12px 0}
.abas button{border:0;border-radius:10px;padding:10px;font-size:15px;font-weight:700;background:#eee;color:#555}
.abas button.on{background:#1f5c3a;color:#fff}
.est{width:100%;border-collapse:collapse;font-size:15px}.est th{font-size:12px;color:#888;text-transform:uppercase;text-align:right;padding:4px 6px;font-weight:600}
.est th:first-child,.est td:first-child{text-align:left}.est td{padding:9px 6px;border-bottom:1px solid #eee;text-align:right}
.est .bx{color:#b3261e;font-weight:700}.est .ok{color:#1f5c3a}.est .nd{color:#aaa}
.cx{background:#f6f3e6;border-radius:12px;padding:12px;margin:10px 0}
.cx label{display:block;font-size:13px;color:#666;margin:6px 0 2px}
.cx select,.cx input{width:100%;font-size:17px;padding:10px;border:1px solid #ccc;border-radius:10px;background:#fff}
.nota{font-size:13px;color:#777;margin:6px 0}
.mv{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #eee;font-size:14px}.mv span{flex:1}
.dif{border-radius:10px;padding:10px;margin:8px 0;font-size:15px;background:#e3f1e8;color:#1f5c3a}.dif.ruim{background:#fbe3e1;color:#7a1712}
.kc{background:#fff;border:2px solid #e4e4de;border-radius:12px;padding:8px 10px;margin:8px 0}
.kc.feito{border-color:#1f5c3a;background:#eef7f1}
.kc .kn{font-size:16px;font-weight:700}.kc .kn small{font-weight:400;color:#888;font-size:13px}
.kc .kb{display:grid;grid-template-columns:64px 1fr 64px 64px;gap:6px;margin-top:6px}
.kc .kb button{border:0;border-radius:12px;font-size:30px;font-weight:800;height:56px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.kc .kb .km{background:#fbe3e1;color:#b3261e}.kc .kb .kp{background:#d7eadf;color:#1f5c3a}
.kc .kb .kk{background:#eee;color:#999;font-size:24px}.kc.feito .kb .kk{background:#1f5c3a;color:#fff}
.cx .kc .kb input{height:56px;font-size:26px;font-weight:800;text-align:center;padding:4px}
.foto{width:100%;font-size:20px!important;padding:18px 6px!important;margin:6px 0 4px}
.espera{text-align:center;font-size:18px;padding:22px 10px}
</style>
</head>
<body>
<div class="top">
  <div class="cab"><b id="dia"></b><span class="res" id="res"></span><button class="ic" id="bResumo">Fechar dia</button><button class="ic" id="bDono">⚙︎</button></div>
  <input id="nome" placeholder="Escreva o nome…" autocomplete="off" autocapitalize="words">
  <button class="novo" id="novo"></button>
  <div class="dup" id="dup"></div>
</div>
<div class="folha" id="folha"></div>

<div class="sheet" id="sheet"><div class="panel">
  <div class="ph"><h2 id="sNome"></h2><span class="t" id="sTot"></span></div>
  <div class="pb" id="sBody"></div>
  <div class="fechar" id="fechar"></div>
  <div class="pf"><button class="b3" id="bVolta">✓ Pronto</button><button class="b1" id="bFechar" style="font-size:15px;font-weight:600">Fechar conta</button></div>
</div></div>

<div class="sheet" id="resumo"><div class="panel">
  <div class="ph"><h2>Resumo do dia</h2></div>
  <div class="pb res-dia" id="rBody"></div>
  <div class="pf" style="grid-template-columns:1fr 1fr"><button class="b1" id="rVolta">Voltar</button><a class="btn b3" id="rZap" href="#" target="_blank" rel="noopener">Enviar no WhatsApp</a><button class="b4" id="rBk" style="grid-column:1/3">Enviar backup do dia</button></div>
</div></div>

<div class="sheet" id="dono"><div class="panel">
  <div class="ph"><h2>Área do dono</h2></div>
  <div class="abas"><button data-aba="estoque">Estoque</button><button data-aba="produtos">Produtos e preços</button></div>
  <div class="pb dono" id="dBody"></div>
  <div class="pf" style="grid-template-columns:1fr 1fr"><button class="b1" id="dVolta">Fechar</button><button class="b3" id="dAdd">+ Produto</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const brl=v=>'R$ '+(v||0).toFixed(2).replace('.',',');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hoje=()=>dstr(new Date());
const dbr=s=>s.slice(8,10)+'/'+s.slice(5,7);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1000)}

/* ===== Dados =====
 contas: todas as contas, de todos os dias (histórico completo).
 conta = {id,nome,dia,itens:[{p,nome,preco,t}],status:'aberta'|'paga'|'devendo',forma:'pix'|'dinheiro',pagoDia,t}
 Uma conta "devendo" continua aparecendo nos dias seguintes até ser paga. */
let produtos=[
 {id:'p1',e:'🍺',nome:'Cerveja lata',preco:6},{id:'p2',e:'🍻',nome:'Cerveja 600',preco:12},{id:'p3',e:'🥤',nome:'Refri lata',preco:5},
 {id:'p4',e:'💧',nome:'Água',preco:3},{id:'p5',e:'🥟',nome:'Coxinha',preco:7},{id:'p6',e:'🍟',nome:'Salgadinho',preco:5},
 {id:'p7',e:'🍬',nome:'Bala',preco:0.5},{id:'p8',e:'🍫',nome:'Chocolate',preco:4},{id:'p9',e:'🍦',nome:'Sorvete',preco:8},
 {id:'p10',e:'🍭',nome:'Pirulito',preco:1},{id:'p11',e:'⚡',nome:'Energético',preco:10},{id:'p12',e:'🌭',nome:'Cachorro-quente',preco:9}];
let contas=[], mov=[], aberta=null, db=null, ultimo=null, ultimoT=0, verDevendo=false;
let dia=hoje();

const LS='bar_v2';
function salvarLocal(){try{localStorage.setItem(LS,JSON.stringify({produtos,contas,mov}))}catch(e){}}
function carregarLocal(){try{const s=JSON.parse(localStorage.getItem(LS)||'null');if(s){produtos=s.produtos||produtos;contas=s.contas||[];mov=s.mov||[]}}catch(e){}}
let tmr=null;
function salvar(){salvarLocal();if(!db)return;clearTimeout(tmr);tmr=setTimeout(()=>{
  db.collection('bar').doc('estado').set({json:JSON.stringify({produtos,contas,mov}),t:Date.now()}).catch(()=>{});
},500)}
carregarLocal();

const total=c=>c.itens.reduce((s,i)=>s+i.preco,0);
function agrupa(itens){const m={};itens.forEach(i=>{m[i.p]=m[i.p]||{nome:i.nome,q:0,v:0};m[i.p].q++;m[i.p].v+=i.preco});return m}
const resumo=c=>Object.values(agrupa(c.itens)).map(x=>x.q+' '+x.nome).join(', ')||'nada ainda';
const doDia=()=>contas.filter(c=>c.dia===dia);
const devendo=()=>contas.filter(c=>c.status==='devendo');

function render(){
  if(hoje()!==dia){dia=hoje()}
  $('#dia').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
  const ab=doDia().filter(c=>c.status==='aberta');
  const rec=contas.filter(c=>c.status==='paga'&&c.pagoDia===dia).reduce((s,c)=>s+total(c),0);
  $('#res').textContent=`Aberto ${brl(ab.reduce((s,c)=>s+total(c),0))} · Recebido ${brl(rec)}`;
  const q=$('#nome').value.trim().toLowerCase(), f=c=>!q||c.nome.toLowerCase().includes(q);
  const linha=(c,cls)=>`<div class="linha ${cls}" data-id="${c.id}"><span class="n">${esc(c.nome)}<span class="r">${cls==='dev'?'devendo desde '+dbr(c.dia)+' · ':''}${esc(resumo(c))}</span></span><span class="v">${brl(total(c))}</span></div>`;
  const a=ab.filter(f).sort((x,y)=>y.t-x.t);
  const pg=doDia().filter(c=>c.status==='paga'&&f(c));
  const dv=devendo().filter(f);
  let h=a.map(c=>linha(c,'')).join('');
  if(dv.length){
    const totDv=dv.reduce((s,c)=>s+total(c),0);
    if(q||verDevendo)h+=`<div class="sep dev" id="sepDev">Devendo · ${dv.length} · ${brl(totDv)}${q?'':' ▲'}</div>`+dv.map(c=>linha(c,'dev')).join('');
    else h+=`<div class="sep dev" id="sepDev">Devendo · ${dv.length} pessoa(s) · ${brl(totDv)} ▼ ver</div>`;
  }
  if(pg.length)h+=`<div class="sep">Pagos hoje</div>`+pg.map(c=>linha(c,'pago')).join('');
  $('#folha').innerHTML=h||`<div class="vazio">${q?'Ninguém com esse nome hoje.':'Folha em branco. Escreva o primeiro nome lá em cima.'}</div>`;
  if(h&&!q)$('#folha').insertAdjacentHTML('beforeend','<div class="vazio" style="min-height:120px"></div>');
  $('#folha').querySelectorAll('.linha').forEach(l=>l.onclick=()=>abrir(l.dataset.id));
  const sd=$('#sepDev');if(sd&&!q)sd.onclick=()=>{verDevendo=!verDevendo;render()};
  const exato=ab.some(c=>c.nome.toLowerCase()===q);
  const b=$('#novo');b.style.display=q&&!exato?'block':'none';b.textContent='+ Novo: '+cap($('#nome').value.trim());
  if(!q)$('#dup').style.display='none';
}

/* ----- criar conta, com checagem de nome repetido ----- */
function criar(){
  const n=cap($('#nome').value.trim());if(!n)return;
  const iguais=doDia().filter(c=>c.status==='aberta'&&c.nome.toLowerCase()===n.toLowerCase());
  const dev=devendo().filter(c=>c.nome.toLowerCase()===n.toLowerCase());
  if(iguais.length||dev.length){perguntarDup(n,iguais,dev);return}
  novaConta(n);
}
function perguntarDup(n,iguais,dev){
  const d=$('#dup');d.style.display='block';
  const ex=iguais[0];
  d.innerHTML=`<p>${ex?`Já tem <b>${esc(n)}</b> aberto hoje (${brl(total(ex))}).`:''}${dev.length?` <b>${esc(n)}</b> está devendo ${brl(dev.reduce((s,c)=>s+total(c),0))}.`:''} É a mesma pessoa?</p>
   <div class="bt">${ex?`<button class="btn b3" id="dMesmo">Sim, abrir</button>`:`<button class="btn b3" id="dMesmo">Sim, nova conta</button>`}<button class="btn b1" id="dOutro">Não, é outro</button></div>
   <input id="dApel" placeholder="Apelido: ex. ${esc(n)} goleiro" style="display:none" autocapitalize="words">`;
  $('#dMesmo').onclick=()=>{d.style.display='none';ex?abrir(ex.id):novaConta(n)};
  $('#dOutro').onclick=()=>{const i=$('#dApel');i.style.display='block';i.value=n+' ';i.focus();$('#dOutro').textContent='Criar';
    $('#dOutro').onclick=()=>{const v=cap(i.value.trim());if(!v||v.toLowerCase()===n.toLowerCase()){toast('Escreva um apelido');return}d.style.display='none';novaConta(v)};
    i.onkeydown=e=>{if(e.key==='Enter')$('#dOutro').click()}};
}
function novaConta(n){const c={id:uid(),nome:n,dia,itens:[],status:'aberta',t:Date.now()};contas.push(c);salvar();abrir(c.id)}

/* ----- conta aberta ----- */
function abrir(id){ultimo=null;aberta=contas.find(c=>c.id===id);$('#dup').style.display='none';$('#fechar').classList.remove('on');$('#sheet').classList.add('on');renderConta()}
function renderConta(){
  const c=aberta, g=agrupa(c.itens), trav=c.status!=='aberta';
  $('#sNome').textContent=c.nome;$('#sTot').textContent=brl(total(c));
  let h='';
  const outras=devendo().filter(x=>x.id!==c.id&&x.nome.toLowerCase()===c.nome.toLowerCase());
  if(outras.length&&c.status==='aberta')h+=`<div class="aviso">⚠︎ ${esc(c.nome)} está devendo ${brl(outras.reduce((s,x)=>s+total(x),0))} de ${outras.map(x=>dbr(x.dia)).join(', ')}. <u data-ab="${outras[0].id}">Ver</u></div>`;
  if(c.status==='devendo')h+=`<div class="aviso">Ficou devendo desde ${dbr(c.dia)}. Quando pagar, toque em "Fechar conta".</div>`;
  if(c.status==='paga')h+=`<div class="aviso ok">Paga em ${dbr(c.pagoDia)} no ${c.forma==='pix'?'Pix':'dinheiro'}.</div>`;
  h+=`<div class="lista"><b>Pegou:</b>${Object.keys(g).length?Object.entries(g).map(([pid,x])=>`<div class="pg${pid===ultimo?' novo1':''}"><span><b class="qq">${x.q}×</b> ${esc(x.nome)}</span><b>${brl(x.v)}</b>${trav?'':`<button class="menos" data-m="${pid}">− tirar 1</button>`}</div>`).join(''):' <span style="color:#888">nada ainda</span>'}</div>`;
  if(!trav){const cont={};c.itens.forEach(i=>cont[i.p]=(cont[i.p]||0)+1);
    h+=`<div class="prods">${produtos.map(p=>`<button class="prod" data-p="${p.id}"><span class="e">${p.e||'•'}</span>${esc(p.nome)}<span class="p">${brl(p.preco)}</span>${cont[p.id]?`<span class="q">${cont[p.id]}</span>`:''}</button>`).join('')}</div>`}
  $('#sBody').innerHTML=h;
  $('#sBody').querySelectorAll('[data-ab]').forEach(u=>u.onclick=()=>abrir(u.dataset.ab));
  $('#sBody').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    const agora=Date.now();
    if(b.dataset.p===ultimo&&agora-ultimoT<800){toast('Toque duplo ignorado');return}
    ultimo=b.dataset.p;ultimoT=agora;
    const p=produtos.find(x=>x.id===b.dataset.p);c.itens.push({p:p.id,nome:p.nome,preco:p.preco,t:agora});c.t=agora;
    salvar();renderConta();toast('+1 '+p.nome);if(navigator.vibrate)navigator.vibrate(20);
  });
  $('#sBody').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    const k=c.itens.map(i=>i.p).lastIndexOf(b.dataset.m);if(k<0)return;const it=c.itens.splice(k,1)[0];ultimo=null;salvar();renderConta();toast('Tirou 1 '+it.nome);
  });
  $('#bFechar').textContent=c.status==='paga'?'Reabrir':'Fechar conta';
  $('#bFechar').style.display=(c.status==='aberta'&&!c.itens.length)?'none':'';
}
$('#bVolta').onclick=()=>{
  const c=aberta;if(c&&c.status==='aberta'&&!c.itens.length){contas=contas.filter(x=>x!==c);salvar()}
  $('#sheet').classList.remove('on');aberta=null;$('#nome').value='';render()};
$('#bFechar').onclick=()=>{
  const c=aberta,f=$('#fechar');
  if(c.status==='paga'){c.status=c.forma=c.pagoDia=undefined;c.status='aberta';delete c.forma;delete c.pagoDia;salvar();toast('Reaberta');renderConta();return}
  if(f.classList.contains('on')){f.classList.remove('on');return}

};

/* ----- resumo / fechar o dia ----- */
function textoResumo(){
  const pagosHoje=contas.filter(c=>c.status==='paga'&&c.pagoDia===dia);
  const pix=pagosHoje.filter(c=>c.forma==='pix').reduce((s,c)=>s+total(c),0);
  const din=pagosHoje.filter(c=>c.forma==='dinheiro').reduce((s,c)=>s+total(c),0);
  const fiadoRec=pagosHoje.filter(c=>c.dia!==dia).reduce((s,c)=>s+total(c),0);
  const hojeC=doDia(), vend=hojeC.reduce((s,c)=>s+total(c),0);
  const abertas=hojeC.filter(c=>c.status==='aberta');
  const novoDev=hojeC.filter(c=>c.status==='devendo');
  const dvTot=devendo().reduce((s,c)=>s+total(c),0);
  const g={};hojeC.forEach(c=>c.itens.forEach(i=>{g[i.nome]=g[i.nome]||{q:0,v:0};g[i.nome].q++;g[i.nome].v+=i.preco}));
  const prods=Object.entries(g).sort((a,b)=>b[1].q-a[1].q);
  return {pix,din,fiadoRec,vend,abertas,novoDev,dvTot,prods,n:hojeC.length};
}
function abrirResumo(){
  const r=textoResumo();
  const l=(a,b,cls='')=>`<div class="l ${cls}"><span>${a}</span><b>${b}</b></div>`;
  let h='';
  if(r.abertas.length)h+=`<div class="aviso">⚠︎ Ainda tem ${r.abertas.length} conta(s) aberta(s): ${r.abertas.map(c=>esc(c.nome)).join(', ')}. Feche ou marque "ficou devendo".</div>`;
  h+=`<h3>Caixa</h3>${l('Pix',brl(r.pix))}${l('Dinheiro',brl(r.din))}${l('Total recebido',brl(r.pix+r.din),'big')}`;
  if(r.fiadoRec)h+=`<div style="font-size:14px;color:#666">inclui ${brl(r.fiadoRec)} de dívidas antigas pagas hoje</div>`;
  h+=`<h3>Vendas de hoje</h3>${l('Clientes',r.n)}${l('Vendido',brl(r.vend))}${l('Ficou devendo hoje',brl(r.novoDev.reduce((s,c)=>s+total(c),0)))}${l('Total devendo (todos os dias)',brl(r.dvTot))}`;
  h+=`<h3>Por produto</h3>${r.prods.map(([n,x])=>l(x.q+'× '+esc(n),brl(x.v))).join('')||'<div style="color:#888">nada vendido</div>'}`;
  $('#rBody').innerHTML=h;
  const t=`*Bar - resumo ${new Date().toLocaleDateString('pt-BR')}*\nPix: ${brl(r.pix)}\nDinheiro: ${brl(r.din)}\n*Recebido: ${brl(r.pix+r.din)}*\nVendido hoje: ${brl(r.vend)} (${r.n} clientes)\nFicou devendo hoje: ${brl(r.novoDev.reduce((s,c)=>s+total(c),0))}${r.novoDev.length?' ('+r.novoDev.map(c=>c.nome).join(', ')+')':''}\nTotal devendo: ${brl(r.dvTot)}\n\n*Produtos*\n${r.prods.map(([n,x])=>x.q+'x '+n+' = '+brl(x.v)).join('\n')}`;
  $('#rZap').href='https://wa.me/?text='+encodeURIComponent(t);
  $('#resumo').classList.add('on');
}

/* ----- backup: arquivo .json com tudo (produtos + histórico completo) ----- */
const BKK='bar_ultimo_backup';
const ultimoBk=()=>{try{return localStorage.getItem(BKK)}catch(e){return null}};
async function enviarBackup(){
  const nome='bar-backup-'+hoje()+'.json';
  const txt=JSON.stringify({app:'controle-bar',versao:3,gerado:new Date().toISOString(),produtos,contas,mov});
  const arq=new File([txt],nome,{type:'application/json'});
  const marca=()=>{try{localStorage.setItem(BKK,new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}))}catch(e){}if($('#dono').classList.contains('on'))renderDono()};
  try{
    if(navigator.canShare&&navigator.canShare({files:[arq]})){await navigator.share({files:[arq],title:nome});marca();toast('Backup enviado');return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(arq);a.download=nome;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);marca();toast('Backup baixado');
}
function restaurar(f){
  const r=new FileReader();
  r.onload=()=>{try{
    const s=JSON.parse(r.result);if(s.app!=='controle-bar'||!Array.isArray(s.contas))throw 0;
    if(!confirm(`Restaurar backup de ${new Date(s.gerado).toLocaleString('pt-BR')}?\n${s.contas.length} contas. O que está no celular agora será substituído.`))return;
    salvarCopiaSeguranca();
    contas=s.contas;produtos=s.produtos||produtos;mov=s.mov||[];salvar();renderDono();render();toast('Backup restaurado');
  }catch(e){toast('Arquivo de backup inválido')}};
  r.readAsText(f);
}
/* cópia automática no próprio celular: guarda o estado de antes de cada dia novo (últimos 7) */
function salvarCopiaSeguranca(){try{
  const k='bar_copia_'+hoje();localStorage.setItem(k,JSON.stringify({produtos,contas,mov}));
  Object.keys(localStorage).filter(x=>x.startsWith('bar_copia_')).sort().slice(0,-7).forEach(x=>localStorage.removeItem(x));
}catch(e){}}
$('#rBk').onclick=enviarBackup;
/* ----- PIN da área do dono (guardado só como hash; impede mexida casual, não é cofre) ----- */
const PINK='bar_pin';
async function hashPin(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bar:'+p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function pedirPin(){
  let salvo=null;try{salvo=localStorage.getItem(PINK)}catch(e){}
  if(!salvo){
    const p1=prompt('Crie um PIN de 4 números para a área do dono:');if(p1===null)return false;
    if(!/^\d{4}$/.test(p1)){toast('O PIN precisa ter 4 números');return false}
    const p2=prompt('Repita o PIN:');if(p2!==p1){toast('PINs diferentes');return false}
    try{localStorage.setItem(PINK,await hashPin(p1))}catch(e){}
    toast('PIN criado');return true}
  const p=prompt('PIN do dono:');if(p===null)return false;
  if(await hashPin(p)===salvo)return true;toast('PIN errado');return false}
$('#bDono').onclick=async()=>{if(!await pedirPin())return;$('#dono').classList.add('on');renderDono();
  if(fotoPend){const d=fotoPend;fotoPend=null;abrirEntrada(d,true)}};
/* ===== ESTOQUE (só na área do dono; o balcão não muda nada) =====
 mov = [{id,tipo:'compra'|'contagem',p,q,custo?,calc?,t}]
 Estoque de um produto = última contagem + compras depois dela − vendido depois dela.
 Produto sem nenhuma compra/contagem fica "não controlado" (mostra —). */
let donoAba='estoque', ultimaDif=null;
function vendidos(pid,desde){let n=0;contas.forEach(c=>c.itens.forEach(i=>{if(i.p===pid&&i.t>desde)n++}));return n}
function estoqueDe(pid){
  const ms=mov.filter(m=>m.p===pid);if(!ms.length)return null;
  const cont=ms.filter(m=>m.tipo==='contagem').sort((a,b)=>b.t-a.t)[0];
  const desde=cont?cont.t:0, base=cont?cont.q:0;
  const ent=ms.filter(m=>m.tipo==='compra'&&m.t>desde).reduce((x,m)=>x+m.q,0);
  return base+ent-vendidos(pid,desde);
}
const diasMov=()=>[...new Set(contas.filter(c=>c.itens.length).map(c=>c.dia))].sort().slice(-4);
function mediaDia(pid,ds){if(!ds.length)return 0;let n=0;contas.forEach(c=>{if(ds.includes(c.dia))c.itens.forEach(i=>{if(i.p===pid)n++})});return n/ds.length}
const fmtQ=v=>(Math.round(v*10)/10).toString().replace('.',',');
function renderEstoque(){
  const ds=diasMov();
  const linhas=produtos.map(p=>{
    const tem=estoqueDe(p.id), m=mediaDia(p.id,ds);
    if(tem===null)return {p,tem,m,dura:null,comprar:null};
    const dura=m>0?tem/m:null, comprar=m>0?Math.max(0,Math.ceil(m*1.2-tem)):0;
    return {p,tem,m,dura,comprar};
  });
  const ctl=linhas.filter(l=>l.tem!==null).sort((a,b)=>(a.dura??1e9)-(b.dura??1e9));
  const nao=linhas.filter(l=>l.tem===null);
  const lista=ctl.filter(l=>l.comprar>0);
  let h='';
  if(ultimaDif)h+=ultimaDif;
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn b3" id="eCompra">+ Chegou mercadoria</button><button class="btn b1" id="eCont">Fazer contagem</button></div><div id="eForm"></div>`;
  if(ctl.length){
    h+=`<table class="est" style="margin-top:12px"><tr><th>Produto</th><th>Tem</th><th>Dá p/</th><th>Comprar</th></tr>${ctl.map(l=>{
      const baixo=l.tem<=0||(l.dura!==null&&l.dura<1);
      return `<tr><td>${esc((l.p.e||'')+' '+l.p.nome)}</td><td class="${l.tem<0?'bx':''}">${l.tem}</td><td class="${baixo?'bx':'ok'}">${l.dura===null?'<span class="nd">—</span>':fmtQ(l.dura)+' dia'+(l.dura>=2?'s':'')}</td><td>${l.comprar?'<b>'+l.comprar+'</b>':'<span class="nd">0</span>'}</td></tr>`}).join('')}</table>`;
    h+=`<p class="nota">"Dá p/" = quantos dias de jogo o estoque aguenta, pela média dos ${ds.length?`últimos ${ds.length} dia(s) com venda`:'dias com venda (ainda não tem)'}. "Comprar" cobre o próximo dia de jogo com 20% de folga.${ds.length<4?' <b>Com menos de 4 dias de histórico é só uma estimativa.</b>':''} Número negativo em "Tem" = vendeu mais do que entrou: falta lançar compra ou fazer contagem.</p>`;
    if(lista.length){const t=`*Lista de compra - ${new Date().toLocaleDateString('pt-BR')}*\n`+lista.map(l=>`${l.comprar}x ${l.p.nome} (tem ${l.tem})`).join('\n');
      h+=`<a class="btn b4" style="margin:8px 0" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(t)}">Mandar lista de compra no WhatsApp</a>`}
  }else h+=`<p class="nota" style="margin-top:12px">Nenhum produto controlado ainda. Comece com <b>Fazer contagem</b> (conta o que tem na geladeira e no depósito) ou lance a próxima mercadoria que chegar.</p>`;
  if(nao.length&&ctl.length)h+=`<p class="nota">Sem controle: ${nao.map(l=>esc(l.p.nome)).join(', ')}.</p>`;
  const ult=[...mov].sort((a,b)=>b.t-a.t).slice(0,12);
  if(ult.length)h+=`<h3 style="margin:18px 0 4px;font-size:14px;color:#888;text-transform:uppercase">Últimos lançamentos</h3>`+ult.map(m=>{const p=produtos.find(x=>x.id===m.p);
    const d=new Date(m.t).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
    const txt=m.tipo==='compra'?`Chegou ${m.q} ${esc(p?p.nome:'(produto apagado)')}${m.custo?' · '+brl(m.custo):''}`:`Contagem: ${m.q} ${esc(p?p.nome:'(produto apagado)')}${m.calc!=null&&m.calc!==m.q?` (app dizia ${m.calc})`:''}`;
    return `<div class="mv"><span>${d} · ${txt}</span><button class="b2" style="border:0;border-radius:8px;padding:6px 10px" data-mx="${m.id}">✕</button></div>`}).join('');
  $('#dBody').innerHTML=h;
  $('#eCompra').onclick=formCompra;$('#eCont').onclick=formContagem;
  $('#dBody').querySelectorAll('[data-mx]').forEach(b=>b.onclick=()=>{if(!b.dataset.ok){b.dataset.ok=1;b.textContent='apagar?';return}mov=mov.filter(m=>m.id!==b.dataset.mx);salvar();renderEstoque();toast('Lançamento apagado')});
}

   <button class="btn b4 foto" id="cFoto">📷 Foto da nota</button>
   <input type="file" id="cArq" accept="image/*" capture="environment" style="display:none">

   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn b1" id="cX">Cancelar</button><button class="btn b3" id="cOk">Salvar</button></div></div>`;

function formContagem(){
  $('#eForm').innerHTML=`<div class="cx"><b>Contagem</b><p class="nota" style="margin-top:2px">Conte o que tem de verdade (geladeira + depósito). Toque <b>−</b> e <b>+</b> até chegar no que contou. Se o número já está certo, toque <b>✓</b>. Produto que não contou fica cinza e não é salvo.</p>
   ${produtos.map(p=>{const t=estoqueDe(p.id);return `<div class="kc" data-cp="${p.id}"><div class="kn">${esc((p.e||'')+' '+p.nome)} <small>${t!==null?`(app diz ${t})`:'(ainda sem controle)'}</small></div>
    <div class="kb"><button class="km" data-k="-1">−</button><input inputmode="numeric" value="${Math.max(0,t||0)}"><button class="kp" data-k="1">+</button><button class="kk" data-k="ok">✓</button></div></div>`}).join('')}
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn b1" id="kX">Cancelar</button><button class="btn b3" id="kOk">Salvar contagem</button></div></div>`;
  const conta=()=>{const n=$('#eForm').querySelectorAll('.kc.feito').length;$('#kOk').textContent=n?`Salvar contagem (${n})`:'Salvar contagem'};
  $('#eForm').querySelectorAll('.kc').forEach(row=>{
    const inp=row.querySelector('input');
    const passo=d=>{const v=Math.max(0,(parseInt(inp.value,10)||0)+d);inp.value=v;row.classList.add('feito');conta();if(navigator.vibrate)navigator.vibrate(10)};
    row.querySelectorAll('[data-k]').forEach(b=>{
      if(b.dataset.k==='ok'){b.onclick=()=>{row.classList.toggle('feito');conta()};return}
      const d=+b.dataset.k;let t1=null,t2=null,repetiu=false;
      const para=()=>{clearTimeout(t1);clearInterval(t2)};
      b.onpointerdown=()=>{repetiu=false;para();t1=setTimeout(()=>{repetiu=true;t2=setInterval(()=>passo(d),110)},500)};
      b.onpointerup=b.onpointerleave=b.onpointercancel=para;
      b.oncontextmenu=e=>e.preventDefault();
      b.onclick=()=>{if(repetiu){repetiu=false;return}passo(d)};
    });
    inp.oninput=()=>{inp.value=inp.value.replace(/\D/g,'');row.classList.toggle('feito',inp.value!=='');conta()};
    inp.onfocus=()=>inp.select();
  });

  $('#kOk').onclick=()=>{

      :`<div class="dif"><b>Contagem salva.</b> ${difs.length===0&&mov.filter(m=>m.tipo==='contagem').length>n?'Bateu certinho com o app.':'A partir de agora o app acompanha esses produtos.'}</div>`;

/* ===== ENTRADA PRONTA (lida de foto da nota/pedido) =====
 Chega pelo link  ...#entrada=<base64url de {"itens":[{"nome":"Brahma lata","q":48,"custo":120}]}>
 O dono só confere e confirma: nada entra no estoque sem o OK dele. */
const normal=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function acharProduto(nome){
  const n=normal(nome);let melhor=null,pts=0;
  produtos.forEach(p=>{const pn=normal(p.nome);if(!pn)return;
    let s=0;if(n===pn)s=100;else if(n.includes(pn)||pn.includes(n))s=60;
    else{const a=new Set(n.split(' ')),b=pn.split(' ');s=b.filter(w=>w.length>2&&a.has(w)).length*20}
    if(s>pts){pts=s;melhor=p}});
  return pts>=20?melhor:null;
}
function lerEntrada(){
  const m=location.hash.match(/entrada=([A-Za-z0-9_-]+)/);if(!m)return null;
  try{const b=m[1].replace(/-/g,'+').replace(/_/g,'/');const txt=decodeURIComponent(escape(atob(b+'==='.slice((b.length+3)%4))));
    const d=JSON.parse(txt);return Array.isArray(d.itens)?d:null}catch(e){return null}
}
async function abrirEntrada(d,dentro){
  if(!dentro){history.replaceState(null,'',location.pathname);if(!await pedirPin())return}
  if(!dentro||donoAba!=='estoque'||!$('#eForm')){donoAba='estoque';$('#dono').classList.add('on');renderDono()}
  const linhas=d.itens.map((it,i)=>{const p=produtos.find(x=>x.id===it.p)||acharProduto(it.nome);
    return `<div style="border-bottom:1px solid #e7e2cf;padding:8px 0"><div style="font-size:14px;color:#666">Na nota: <b>${esc(it.nome)}</b></div>
     <select data-ei="${i}" style="margin-top:4px"><option value="">— não lançar —</option>${produtos.map(x=>`<option value="${x.id}"${p&&p.id===x.id?' selected':''}>${esc((x.e||'')+' '+x.nome)}</option>`).join('')}<option value="novo">+ criar produto "${esc(it.nome)}"</option></select>
     <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px"><label style="margin:0">Unidades<input data-eq="${i}" inputmode="numeric" value="${+it.q||''}" placeholder="unidades"></label><label style="margin:0">R$ total pago<input data-ev="${i}" inputmode="decimal" value="${it.custo?String(it.custo).replace('.',','):''}" placeholder="R$"></label></div></div>`}).join('');
  $('#eForm').innerHTML=`<div class="cx"><b>Conferir mercadoria da foto</b><p class="nota" style="margin-top:2px">Confira se o produto e a quantidade em <b>unidades</b> estão certos (fardo de 12 = 12). Só entra no estoque quando tocar em Confirmar.</p>${linhas}
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn b1" id="iX">Cancelar</button><button class="btn b3" id="iOk">Confirmar entrada</button></div></div>`;
  $('#iX').onclick=()=>$('#eForm').innerHTML='';
  $('#iOk').onclick=()=>{const agora=Date.now();let n=0;
    d.itens.forEach((it,i)=>{let pid=$(`[data-ei="${i}"]`).value;const q=parseInt($(`[data-eq="${i}"]`).value,10);
      const v=parseFloat(($(`[data-ev="${i}"]`).value||'').replace(/\./g,'').replace(',','.'));
      if(!pid||!(q>0))return;
      if(pid==='novo'){const np={id:uid(),e:'',nome:cap(String(it.nome).trim()),preco:0};produtos.push(np);pid=np.id}
      const p=produtos.find(x=>x.id===pid);const m={id:uid(),tipo:'compra',p:pid,q,t:agora};if(v>0){m.custo=v;p.custo=v/q}
      mov.push(m);n++});
    if(!n){toast('Nada para lançar');return}
    ultimaDif=`<div class="dif"><b>${n} produto(s) lançados</b> pela foto.${produtos.some(p=>!p.preco)?' Tem produto novo sem preço de venda: acerte em "Produtos e preços".':''}</div>`;
    salvar();renderEstoque();toast('Entrada lançada')};
}
{const d=lerEntrada();if(d)setTimeout(()=>abrirEntrada(d),300)}

/* ===== FOTO DA NOTA =====
 Tira a foto, reduz no celular e manda para o servidor da foto (servidor-foto/, Cloudflare Worker),
 que lê a nota com o Claude e devolve {itens:[{nome,q,custo,p}]}. Depois cai na conferência acima.
 Endereço e código ficam em localStorage 'bar_foto' (fora do bar_v2; não vai no backup). */
const FOTOK='bar_foto';
const FOTO_PADRAO='https://foto-nota-bar.centrodacoroa.workers.dev';
let fotoPend=null;
const fotoCfg=()=>{try{const c=JSON.parse(localStorage.getItem(FOTOK)||'null');return c&&c.u&&c.c?c:null}catch(e){return null}};
function formFotoCfg(depoisFoto){
  const c=fotoCfg()||{u:FOTO_PADRAO,c:''};
  $('#eForm').innerHTML=`<div class="cx"><b>📷 Configurar foto da nota</b><p class="nota" style="margin-top:2px">Só precisa fazer uma vez neste celular.</p>
   <label>Endereço do servidor</label><input id="fU" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="foto-nota-bar.seunome.workers.dev" value="${esc(c.u.replace(/^https:\/\//,''))}">
   <label>Código de acesso</label><input id="fC" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(c.c)}">
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn b1" id="fX">Cancelar</button><button class="btn b3" id="fOk">Salvar</button></div></div>`;
  $('#fX').onclick=()=>{$('#eForm').innerHTML=''};
  $('#fOk').onclick=()=>{
    let u=$('#fU').value.trim().replace(/\s/g,'').replace(/\/+$/,''), k=$('#fC').value.trim();
    if(!u||!k){toast('Preencha os dois');return}
    if(!/^https?:\/\//i.test(u))u='https://'+u;
    try{localStorage.setItem(FOTOK,JSON.stringify({u,c:k}))}catch(e){}
    toast('Foto configurada');
    if(depoisFoto&&$('#eForm'))formCompra();else if(donoAba==='produtos')renderDono();else $('#eForm').innerHTML='';
  };
}
async function reduzirFoto(f){
  const url=URL.createObjectURL(f);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const M=2000,s=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*s);cv.height=Math.round(img.naturalHeight*s);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    return cv.toDataURL('image/jpeg',0.8).split(',')[1];
  }finally{URL.revokeObjectURL(url)}
}
function fotoErro(txt,cfg){
  if(!$('#eForm'))return;
  $('#eForm').innerHTML=`<div class="cx"><div class="aviso" style="margin:0 0 10px">${txt}</div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn b1" id="fvX">Voltar</button><button class="btn b4" id="fvF">${cfg?'Arrumar configuração':'📷 Tirar outra'}</button></div></div>`;
  $('#fvX').onclick=()=>{$('#eForm').innerHTML=''};
  $('#fvF').onclick=()=>{if(cfg)formFotoCfg(true);else{formCompra();$('#cArq').click()}};
}
async function lerFoto(f){
  const cfg=fotoCfg();if(!cfg){formFotoCfg(true);return}
  $('#eForm').innerHTML=`<div class="cx espera">⏳ <b>Lendo a nota…</b><br><span class="nota">Pode levar até 1 minuto. Não feche o app.</span></div>`;
  let r,d;
  try{
    const imagem=await reduzirFoto(f);
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),100000);
    try{
      r=await fetch(cfg.u,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json','X-Codigo':cfg.c},
        body:JSON.stringify({imagem,tipo:'image/jpeg',produtos:produtos.map(p=>({id:p.id,nome:p.nome}))})});
      d=await r.json().catch(()=>({}));
    }finally{clearTimeout(tm)}
  }catch(e){
    fotoErro(e&&e.name==='AbortError'?'Demorou demais. Tente de novo.':(navigator.onLine===false?'Sem internet. A foto precisa de internet: tente quando voltar o sinal.':'Não consegui falar com o servidor da foto. Confira a internet e o endereço.'),!navigator.onLine?false:e&&e.name!=='AbortError');
    return}
  if(!r.ok){fotoErro((d&&d.erro)||'Erro no servidor da foto.',r.status===401||r.status===403||r.status===404);return}
  const itens=(d.itens||[]).filter(x=>x&&x.nome);
  if(!itens.length){fotoErro('Não achei produtos na foto. Tire outra, de perto, reta e com luz.',false);return}
  if(!$('#dono').classList.contains('on')){fotoPend={itens};toast('Nota lida: abra a área do dono para conferir');return}
  abrirEntrada({itens},true);
}

  if(typeof claude==='undefined')return;
  db=await claude.use('db');if(!db)return;
  const d=await db.collection('bar').doc('estado').get();const dd=d&&(typeof d.data==='function'?d.data():d);
  if(dd&&dd.json){const s=JSON.parse(dd.json);if((s.contas||[]).length>=contas.length){contas=s.contas;produtos=s.produtos||produtos;mov=s.mov||mov;salvarLocal();render()}}
  else salvar();
}catch(e){}})();
