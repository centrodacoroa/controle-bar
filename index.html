<head>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fdfbf3;color:#1d1d1b}
button{font-family:inherit}
.top{position:sticky;top:0;z-index:5;background:#fdfbf3;padding:10px 12px 8px;border-bottom:2px solid #e0c9c9}
.cab{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cab b{font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .res{font-size:13px;color:#555;margin:-6px 0 4px;padding:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;-webkit-user-select:none;user-select:none}
.top .res .rb{color:#1f5c3a;font-weight:600}
.cab .logo{height:40px;width:auto;flex:none;margin:-4px 0}
.ic{border:1px solid #ddd;background:#fff;border-radius:10px;font-size:14px;padding:6px 10px;color:#333}
#nome{width:100%;font-size:20px;padding:14px;border:2px solid #1f5c3a;border-radius:12px;background:#fff}
.novo{display:none;width:100%;margin-top:8px;border:0;border-radius:12px;padding:14px;font-size:18px;font-weight:700;background:#1f5c3a;color:#fff}
.dup{display:none;margin-top:8px;background:#fff3cd;border:1px solid #e8d48a;border-radius:12px;padding:10px}
.dup p{margin:0 0 8px;font-size:16px}
.dup .bt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dup input{width:100%;font-size:17px;padding:10px;border:1px solid #ccc;border-radius:10px;margin-top:8px}
.folha{max-width:720px;margin:0 auto;background:repeating-linear-gradient(#fdfbf3 0 55px,#c9d8ea 55px 56px)}
.linha{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 12px 6px 18px;border-left:2px solid #e0a3a3;margin-left:28px;cursor:pointer}
.linha .n{font-size:19px;font-weight:700;min-width:0;flex:1}
.linha .r{display:block;font-size:13px;font-weight:400;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha .v{font-size:19px;font-weight:700;color:#1f5c3a;white-space:nowrap}
.linha.pago{opacity:.5}
.linha.pago .n,.linha.pago .v{text-decoration:line-through;color:#555}
.linha.dev .v{color:#b3261e}
.sep{margin-left:28px;padding:10px 18px 4px;border-left:2px solid #e0a3a3;font-size:13px;color:#888;text-transform:uppercase}
.sep.dev{color:#b3261e;cursor:pointer}
.vazio{margin-left:28px;border-left:2px solid #e0a3a3;padding:20px 18px;color:#888;min-height:200px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}
.sheet.on{display:block}
.panel{position:absolute;left:0;right:0;bottom:0;top:30px;background:#fff;border-radius:18px 18px 0 0;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.ph{padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee}
.ph h2{margin:0;font-size:24px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph .t{font-size:24px;font-weight:800;color:#1f5c3a}
.vt{border:1px solid #cfd8d2;background:#f3f6f4;color:#1f5c3a;border-radius:10px;padding:8px 12px;font-size:15px;font-weight:700;white-space:nowrap}
.vt.on{border:0;background:none;padding:0 4px;font-size:24px;font-weight:800}
.pb{flex:1;overflow:auto;padding:12px}
.aviso{background:#fbe3e1;color:#7a1712;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.aviso.ok{background:#e3f1e8;color:#1f5c3a}
.lista{margin:0 0 14px;background:#f6f3e6;border-radius:12px;padding:8px 12px;font-size:16px;color:#444}
.pg{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #e7e2cf}.pg:last-child{border-bottom:0}.pg span{flex:1}
.qq{font-size:20px;color:#1f5c3a}
.hb{display:block;border:0;background:none;color:#1f5c3a;font-size:14px;font-weight:600;padding:8px 0 2px}
.hist{border-top:1px solid #e7e2cf;margin-top:4px;padding-top:4px;font-size:14px;max-height:240px;overflow:auto}
.he{display:flex;gap:10px;padding:3px 0}.he span{color:#888;min-width:44px;font-variant-numeric:tabular-nums}
.hx{color:#b3261e}
.novo1{animation:pisca 1s}@keyframes pisca{0%{background:#bfe3cc}100%{background:transparent}}
.menos{border:0;background:#fbe3e1;color:#b3261e;border-radius:10px;padding:8px 12px;font-size:15px;font-weight:700}
.prods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prod{border:2px solid #e4e4de;border-radius:14px;background:#fff;padding:10px 4px;font-size:15px;font-weight:700;min-height:86px;position:relative;color:#1d1d1b}
.prod .e{display:block;font-size:26px}
.prod .p{display:block;font-weight:400;color:#1f5c3a;font-size:14px}
.prod .q{position:absolute;top:-8px;right:-6px;background:#1f5c3a;color:#fff;border-radius:12px;min-width:24px;padding:2px 6px;font-size:14px}
.prod:active,.cat:active{background:#d7eadf;transform:scale(.97)}
.tit{font-size:13px;color:#888;text-transform:uppercase;font-weight:700;margin:2px 2px 8px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{border:2px solid #e4e4de;border-radius:14px;background:#fff;padding:8px 4px;font-size:15px;font-weight:700;min-height:72px;position:relative;color:#1d1d1b;line-height:1.15}
.cat .e{display:block;font-size:26px;margin-bottom:2px}
.cat .p{display:block;font-weight:400;color:#1f5c3a;font-size:13px}
.cat.on{border-color:#1f5c3a;background:#e3f1e8}
.cat .q{position:absolute;top:-8px;right:-6px;background:#1f5c3a;color:#fff;border-radius:12px;min-width:24px;padding:2px 6px;font-size:14px}
.abre{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#e3f1e8;border:2px solid #1f5c3a;border-radius:14px;padding:12px 8px 8px}
.abre .prod{background:#fff;min-height:66px}
.pf{display:grid;grid-template-columns:2fr 1fr;gap:8px;padding:10px 12px 16px;border-top:1px solid #eee}
.pf button,.btn{border:0;border-radius:12px;padding:16px 6px;font-size:17px;font-weight:700}
.b1{background:#eee;color:#333}.b2{background:#fbe3e1;color:#b3261e}.b3{background:#1f5c3a;color:#fff}.b4{background:#1a73c9;color:#fff}
.fechar{display:none;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 0}
.fechar.on{display:grid}
.fechar .w{grid-column:1/3}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#1d1d1b;color:#fff;padding:10px 18px;border-radius:20px;font-size:16px;opacity:0;transition:.15s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
.dono table{width:100%;border-collapse:collapse}.dono td{padding:6px;border-bottom:1px solid #eee}
.dono input{font-size:16px;padding:8px;border:1px solid #ccc;border-radius:8px;width:100%}
.res-dia{font-size:16px;line-height:1.5}
.res-dia h3{font-size:14px;text-transform:uppercase;color:#888;margin:16px 0 4px}
.res-dia .l{display:flex;justify-content:space-between;border-bottom:1px solid #f0f0f0;padding:4px 0}
.res-dia .big{font-size:22px;font-weight:800}
a.btn{display:block;text-align:center;text-decoration:none}
.abas{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 12px 0}
.abas button{border:0;border-radius:10px;padding:10px;font-size:15px;font-weight:700;background:#eee;color:#555}
.abas button.on{background:#1f5c3a;color:#fff}
.abas.t3{grid-template-columns:1fr 1fr 1fr}
.abas.t4{grid-template-columns:1fr 1fr 1fr 1fr}.abas.t4 button{font-size:14px;padding:10px 2px}
.abas.t5{display:flex;overflow-x:auto;scrollbar-width:none}.abas.t5::-webkit-scrollbar{display:none}.abas.t5 button{flex:none;font-size:14px;padding:10px 12px}
.b5{background:#8a6fd1;color:#fff}.b6{background:#4a2a8c;color:#fff} /* débito mais claro, crédito mais forte */
.bpix{background:#32BCAD;color:#fff} /* cor do Pix */
.fechar .btn.fp{padding:15px 6px;font-size:18px}.fechar .btn.fp .fn{display:flex;align-items:center;justify-content:center;gap:8px}
.fechar .ftot{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 4px;font-size:16px;color:#444}.fechar .ftot b{font-size:28px;color:#1f5c3a}
.fechar .fsub{font-size:14px;color:#666;padding:0 4px;margin-top:-6px}
.fechar .btn.fp svg,.fechar .btn.fp .ic{width:22px;height:22px;flex:none;font-size:20px;line-height:22px}
.fechar .btn.volta{background:#fff;color:#1f5c3a;border:2px solid #1f5c3a}
.fechar .btn.devm{background:none;border:1px solid #e8b4b0;color:#b3261e;padding:7px 6px;font-size:14px;font-weight:600;justify-self:center;width:60%} /* pendura é rara: discreto, no fim */
.fechar{max-height:58vh;overflow-y:auto}
.fechar .fi{font-size:15px;color:#333;padding:2px}
.fechar .dv{display:flex;gap:6px}.fechar .dv button{flex:1;border:0;border-radius:10px;padding:10px 0;font-size:16px;font-weight:700;background:#eee;color:#333}.fechar .dv button.on{background:#1f5c3a;color:#fff}
.fechar .fits label{display:flex;gap:10px;align-items:center;padding:7px 2px;font-size:16px;border-bottom:1px solid #eee}.fechar .fits b{margin-left:auto}.fechar .fits input{width:20px;height:20px}
.fechar input.fv{width:100%;font-size:17px;padding:10px;border:1px solid #ccc;border-radius:10px}
.troco{display:flex;align-items:center;gap:8px;font-size:15px;color:#555}.troco input{width:110px;font-size:17px;padding:8px;border:1px solid #ccc;border-radius:10px}.troco b{color:#1f5c3a}
.bprod{width:100%;font-size:17px;padding:11px 12px;border:1px solid #ccc;border-radius:12px;background:#fff;margin-top:6px}
.cli1{display:inline-block;border:0;background:#eef4f0;color:#1f5c3a;border-radius:10px;padding:6px 10px;font-size:14px;margin:0 6px 10px 0;text-decoration:none}
a.cobra{flex:none;background:#1f8f4e;color:#fff;border-radius:10px;padding:9px 10px;font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}
.acaba{background:#fff3cd;color:#7a5a00;border-radius:12px;padding:10px 12px;margin:8px 12px 4px 40px;font-size:15px;cursor:pointer}
.barra{height:10px;background:#1f5c3a;border-radius:5px;min-width:2px}
.rel .bl{display:grid;grid-template-columns:62px 1fr 92px;gap:8px;align-items:center;font-size:14px;padding:2px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{border:0;border-radius:10px;padding:8px 10px;font-size:14px;font-weight:700;background:#eee;color:#333}.chips button.on{background:#1f5c3a;color:#fff}
.dmes{display:flex;justify-content:space-between;font-size:14px;text-transform:uppercase;color:#888;margin:16px 0 2px;font-weight:700}
.dd{border-bottom:1px solid #eee;padding:9px 2px;display:flex;justify-content:space-between;gap:8px;cursor:pointer;font-size:15px}
.dd small{display:block;color:#777;font-size:13px}.dd .r{text-align:right;white-space:nowrap}
.dc{border-bottom:1px solid #f0f0f0;padding:5px 0}.dc summary{display:flex;justify-content:space-between;gap:8px;cursor:pointer;list-style:none}
.dc summary::-webkit-details-marker{display:none}.dc summary small{display:block;color:#777;font-size:13px}
.dc .it{display:flex;justify-content:space-between;font-size:14px;color:#555;padding:1px 0 1px 14px}
.gav{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gres{font-size:15px;margin:8px 0 0}
.est{width:100%;border-collapse:collapse;font-size:15px}.est th{font-size:12px;color:#888;text-transform:uppercase;text-align:right;padding:4px 6px;font-weight:600}
.est th:first-child,.est td:first-child{text-align:left}.est td{padding:9px 6px;border-bottom:1px solid #eee;text-align:right}
.est .bx{color:#b3261e;font-weight:700}.est .ok{color:#1f5c3a}.est .nd{color:#aaa}
.cx{background:#f6f3e6;border-radius:12px;padding:12px;margin:10px 0}
.cx label{display:block;font-size:13px;color:#666;margin:6px 0 2px}
.cx select,.cx input{width:100%;font-size:17px;padding:10px;border:1px solid #ccc;border-radius:10px;background:#fff}
.nota{font-size:13px;color:#777;margin:6px 0}
.mv{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #eee;font-size:14px}.mv span{flex:1}
.gcat{background:#f6f3e6;border-radius:12px;padding:8px;margin:0 0 12px}
.gh{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.gh .ge{width:52px;flex:none;text-align:center;font-size:20px}.gh .gn{flex:1;font-weight:700;font-size:17px}
.gx{border:0;border-radius:8px;padding:8px 10px;background:#fbe3e1;color:#b3261e;font-weight:700;font-size:14px;flex:none;max-width:45%}
.gx.conf{background:#b3261e;color:#fff}
.gp{display:grid;grid-template-columns:44px 1fr 78px 40px;gap:6px;align-items:center;background:#fff;border-radius:10px;padding:6px;margin-bottom:6px}
.gp input{padding:8px 6px}
.gf{width:44px;height:44px;padding:0!important;border:1px solid #ccc!important;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-size:18px;line-height:1}
.gf img{width:100%;height:100%;object-fit:contain}.gf small{font-size:11px}
.gsf{border:0;background:none;color:#b3261e;font-size:13px;text-decoration:underline;padding:2px 0!important}.gsf.conf{font-weight:700}
.prod .fi{display:block;width:100%;height:84px;object-fit:contain;margin:0 auto 6px}
.prod.cf{padding-top:6px;line-height:1.15}
.toast{max-width:92vw;text-align:center}
.gp button{border:0;border-radius:8px;padding:8px 0}
.gm{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:13px;color:#777}
.gm select{flex:1;font-size:15px;padding:6px;border:1px solid #ccc;border-radius:8px;background:#fff}
.gadd{width:100%;border:1px dashed #1f5c3a;background:transparent;color:#1f5c3a;border-radius:10px;padding:10px;font-size:15px;font-weight:700}
.rl{display:flex;align-items:center;gap:8px;margin-bottom:6px}.rl .res{flex:1;min-width:0;margin:0}
#bPrecos.falta{background:#fff3cd;border-color:#e8d48a;font-weight:700}
.px{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 0}.px .btn{padding:12px 6px;font-size:16px}
#pForm{max-height:60vh;overflow:auto;padding:0 12px;flex:none}
.pfil{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:10px 12px 0}
.pfil button{border:0;border-radius:10px;padding:10px 2px;font-size:14px;font-weight:700;background:#eee;color:#555}.pfil button.on{background:#1f5c3a;color:#fff}
.pc h4{margin:14px 0 4px;font-size:15px;color:#1f5c3a;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pc h4 button,.pl .okk{border:0;border-radius:8px;background:#e3f1e8;color:#1f5c3a;font-size:13px;font-weight:700;padding:8px 10px}
.pl{display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee;padding:6px 0;font-size:16px}.pl span{flex:1;min-width:0}.pl small{display:block;color:#b26b00;font-size:12px}
.pl input{width:96px;font-size:20px;padding:10px 8px;border:2px solid #cfd8d2;border-radius:10px;text-align:right}.pl.f input{border-color:#e8b84a;background:#fffaf0}
.pl .sv{font-style:normal;font-size:13px;font-weight:700;color:#1f5c3a;white-space:nowrap}
#bNuv.nk{color:#1f5c3a}#bNuv.nf{background:#fbe3e1;color:#b3261e}.cab .ic{white-space:nowrap;padding:6px 8px}
.dif{border-radius:10px;padding:10px;margin:8px 0;font-size:15px;background:#e3f1e8;color:#1f5c3a}.dif.ruim{background:#fbe3e1;color:#7a1712}
</style>
</head>
<body>
<div class="top">
  <div class="cab"><img class="logo" src="logo.png" alt="Centro da Coroa F.C."><b id="dia"></b><button class="ic" id="bNuv">☁</button><button class="ic" id="bResumo">Fechar dia</button><button class="ic" id="bDono">⚙︎</button></div>
  <div class="rl"><div class="res" id="res"></div><button class="ic" id="bPrecos">💲 Preços</button></div>
  <input id="nome" placeholder="Nome ou celular…" autocomplete="off" autocapitalize="words">
  <button class="novo" id="novo"></button>
  <div class="dup" id="dup"></div>
</div>
<div class="folha" id="folha"></div>

<div class="sheet" id="sheet"><div class="panel">
  <div class="ph"><h2 id="sNome"></h2><span class="t" id="sTot"></span></div>
  <div class="pb" id="sBody"></div>
  <div class="fechar" id="fechar"></div>
  <div class="pf"><button class="b3" id="bVolta">✓ Pronto</button><button class="b1" id="bFechar" style="font-size:15px;font-weight:600">Fechar conta</button></div>
</div></div>

<div class="sheet" id="resumo"><div class="panel">
  <div class="ph"><h2>Resumo do dia</h2></div>
  <div class="pb res-dia" id="rBody"></div>
  <div class="pf" style="grid-template-columns:1fr 1fr"><button class="b1" id="rVolta">Voltar</button><a class="btn b3" id="rZap" href="#" target="_blank" rel="noopener">Enviar no WhatsApp</a><button class="b4" id="rBk" style="grid-column:1/3">Enviar backup do dia</button></div>
</div></div>

<div class="sheet" id="dono"><div class="panel">
  <div class="ph"><h2>Área do dono</h2></div>
  <div class="abas t5"><button data-aba="dias">Dias</button><button data-aba="clientes">Clientes</button><button data-aba="estoque">Estoque</button><button data-aba="produtos">Produtos</button><button data-aba="func">Funcionários</button></div>
  <div class="pb dono" id="dBody"></div>
  <div class="pf" style="grid-template-columns:1fr 1fr"><button class="b1" id="dVolta">Fechar</button><button class="b3" id="dAdd">+ Categoria</button></div>
</div></div>
<div class="sheet" id="precos"><div class="panel">
  <div class="ph"><h2>Preços e produtos</h2></div>
  <div class="px"><button class="btn b3" id="pNovo">+ Novo produto</button><button class="btn b4" id="pEnviar">Enviar preços</button></div>
  <div id="pForm"></div>
  <div class="pfil" id="pFil"></div>
  <div class="pb" id="pBody"></div>
  <div class="pf" style="grid-template-columns:1fr"><button class="b1" id="pVolta">✓ Pronto</button></div>
</div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fotoArq" accept="image/*" style="display:none">

<script>
const $=s=>document.querySelector(s);
const brl=v=>'R$ '+(v||0).toFixed(2).replace('.',',');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
/* o dia do bar vira às 6h: a madrugada ainda é o movimento da noite */
const VIRA=6*3600e3, hoje=()=>dstr(new Date(Date.now()-VIRA));
const diaData=()=>new Date(dia+'T12:00:00');
const dbr=s=>s.slice(8,10)+'/'+s.slice(5,7);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const normal=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function toast(t,ms){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),ms||1000)}

/* ===== Dados =====
 contas: todas as contas, de todos os dias (histórico completo).
 conta = {id,nome,dia,itens:[{p,nome,preco,t}],status:'aberta'|'paga'|'devendo',forma:'pix'|'dinheiro'|'debito'|'credito',pagoDia,pagoV,extra,t}

    c.itens.forEach(i=>{if(i.sp)delete i.sp});c.status='casa';evento(c,{t:agora,k:'casa'});toast('🏠 Consumo da casa: '+c.nome,2000);sai();return}

/* ----- backup: arquivo .json com tudo (produtos + histórico completo) ----- */
const BKK='bar_ultimo_backup';
const ultimoBk=()=>{try{return localStorage.getItem(BKK)}catch(e){return null}};
async function enviarBackup(){
  const nome='bar-backup-'+hoje()+'.json';
  const txt=JSON.stringify({app:'controle-bar',versao:5,gerado:new Date().toISOString(),...estado()});
  const arq=new File([txt],nome,{type:'application/json'});
  const marca=()=>{try{localStorage.setItem(BKK,new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}))}catch(e){}if($('#dono').classList.contains('on'))renderDono()};
  try{
    if(navigator.canShare&&navigator.canShare({files:[arq]})){await navigator.share({files:[arq],title:nome});marca();toast('Backup enviado');return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(arq);a.download=nome;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);marca();toast('Backup baixado');
}
function restaurar(f){
  const r=new FileReader();
  r.onload=()=>{try{
    const s=JSON.parse(r.result);if(s.app!=='controle-bar'||!Array.isArray(s.contas))throw 0;
    if(!confirm(`Restaurar backup de ${new Date(s.gerado).toLocaleString('pt-BR')}?\n${s.contas.length} contas. O que está ${sync.ligado&&chave()?'em TODOS os celulares ligados':'no celular'} agora será substituído.`))return;
    salvarCopiaSeguranca();
    aplicar(s);salvar();renderDono();render();toast('Backup restaurado'); // backup antigo (sem categorias) passa pela migração
  }catch(e){toast('Arquivo de backup inválido')}};
  r.readAsText(f);
}
/* cópia automática no próprio celular: guarda o estado de antes de cada dia novo (últimos 2) */
function salvarCopiaSeguranca(){try{
  // cópia sem as fotos tiradas no celular (são o que mais ocupa; cópias com fotos lotariam a memória)
  const s=estado();s.produtos=s.produtos.map(p=>String(p.foto||'').startsWith('data:')?{...p,foto:''}:p);
  const k='bar_copia_'+hoje();localStorage.setItem(k,JSON.stringify(s));
  copias().slice(0,-2).forEach(x=>localStorage.removeItem(x));
}catch(e){}}
$('#rBk').onclick=enviarBackup;
/* ----- PIN da área do dono (guardado só como hash; impede mexida casual, não é cofre) ----- */
const PINK='bar_pin';
async function hashPin(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bar:'+p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
const PIN_ATIVO=false; // desligado a pedido (25/11/2026) até existir login de dono/funcionário; true volta a pedir
async function pedirPin(){
  if(!PIN_ATIVO)return true;
  let salvo=null;try{salvo=localStorage.getItem(PINK)}catch(e){}
  if(!salvo){
    const p1=prompt('Crie um PIN de 4 números para a área do dono:');if(p1===null)return false;
    if(!/^\d{4}$/.test(p1)){toast('O PIN precisa ter 4 números');return false}
    const p2=prompt('Repita o PIN:');if(p2!==p1){toast('PINs diferentes');return false}
    try{localStorage.setItem(PINK,await hashPin(p1))}catch(e){}
    toast('PIN criado');return true}
  const p=prompt('PIN do dono:');if(p===null)return false;
  if(await hashPin(p)===salvo)return true;toast('PIN errado');return false}
$('#bDono').onclick=async()=>{if(!await pedirPin())return;$('#dono').classList.add('on');renderDono()};
/* ===== ESTOQUE (só na área do dono; o balcão não muda nada) =====
 mov = [{id,tipo:'compra'|'contagem',p,q,custo?,calc?,t}]
 Estoque de um produto = última contagem + compras depois dela − vendido depois dela.
 Produto sem nenhuma compra/contagem fica "não controlado" (mostra —). */
let donoAba='dias', ultimaDif=null;
function vendidos(pid,desde){let n=(arq.vend[pid]||[]).filter(t=>t>desde).length;contas.forEach(c=>c.itens.forEach(i=>{if(i.p===pid&&i.t>desde)n++}));return n}
function estoqueDe(pid){
  const ms=mov.filter(m=>m.p===pid);if(!ms.length)return null;
  const cont=ms.filter(m=>m.tipo==='contagem').sort((a,b)=>b.t-a.t)[0];
  const desde=cont?cont.t:0, base=cont?cont.q:0;
  const ent=ms.filter(m=>m.tipo==='compra'&&m.t>desde).reduce((x,m)=>x+m.q,0);
  return base+ent-vendidos(pid,desde);
}
/* aviso de estoque baixo: produto com mínimo (p.min) e estoque controlado que chegou nele */
function acabando(){return produtos.filter(p=>p.min>0).map(p=>({p,tem:estoqueDe(p.id)})).filter(l=>l.tem!==null&&l.tem<=l.p.min)}
const diasMov=()=>[...new Set(contas.filter(c=>c.itens.length).map(c=>c.dia))].sort().slice(-4);
function mediaDia(pid,ds){if(!ds.length)return 0;let n=0;contas.forEach(c=>{if(ds.includes(c.dia))c.itens.forEach(i=>{if(i.p===pid)n++})});return n/ds.length}
const fmtQ=v=>(Math.round(v*10)/10).toString().replace('.',',');

  const ds=diasMov();

    const dura=m>0?tem/m:null, comprar=m>0||p.min>0?Math.max(0,Math.ceil(m*1.2+(p.min||0)-tem)):0; // próximo dia + a reserva do aviso
    return {p,tem,m,dura,comprar};
  });
  const ctl=linhas.filter(l=>l.tem!==null).sort((a,b)=>(a.dura??1e9)-(b.dura??1e9));

      const baixo=l.tem<=0||(l.dura!==null&&l.dura<1)||(l.p.min>0&&l.tem<=l.p.min);
      return `<tr><td>${esc(emoDe(l.p)+' '+l.p.nome)}</td><td class="${l.tem<0?'bx':''}">${l.tem}</td><td class="${baixo?'bx':'ok'}">${l.dura===null?'<span class="nd">—</span>':fmtQ(l.dura)+' dia'+(l.dura>=2?'s':'')}</td><td>${l.comprar?'<b>'+l.comprar+'</b>':'<span class="nd">0</span>'}</td></tr>`}).join('')}</table>`;
    h+=`<p class="nota">"Dá p/" = quantos dias de jogo o estoque aguenta, pela média dos ${ds.length?`últimos ${ds.length} dia(s) com venda`:'dias com venda (ainda não tem)'}. "Comprar" cobre o próximo dia de jogo com 20% de folga.${ds.length<4?' <b>Com menos de 4 dias de histórico é só uma estimativa.</b>':''} Número negativo em "Tem" = vendeu mais do que entrou: falta lançar compra ou fazer contagem.</p>`;
    if(lista.length){const t=`*Lista de compra - ${new Date().toLocaleDateString('pt-BR')}*\n`+lista.map(l=>`${l.comprar}x ${l.p.nome} (tem ${l.tem})`).join('\n');

    h+=`<details class="dc" style="margin-top:6px"><summary><span>🔔 Aviso de estoque baixo<small>${ctl.filter(l=>l.p.min>0).length} produto(s) com aviso · toque para escolher</small></span><b>▼</b></summary>${ctl.map(l=>`<div class="mv"><span>${esc(l.p.nome)} <small style="color:#888">(tem ${l.tem})</small></span><input data-min="${l.p.id}" inputmode="numeric" placeholder="avisar com" value="${l.p.min>0?l.p.min:''}" style="width:110px;font-size:16px;padding:8px;border:1px solid #ccc;border-radius:10px"></div>`).join('')}<p class="nota">Quando o estoque chegar nesse número, aparece "Acabando" na tela principal, e o "Comprar" repõe essa reserva. Deixe em branco para não avisar.</p></details>`;
  }else h+=`<p class="nota" style="margin-top:12px">Nenhum produto controlado ainda. Comece com <b>Fazer contagem</b> (conta o que tem na geladeira e no depósito) ou lance a próxima mercadoria que chegar.</p>`;
  if(nao.length&&ctl.length)h+=`<p class="nota">Sem controle: ${nao.map(l=>esc(l.p.nome)).join(', ')}.</p>`;
  const ult=[...mov].sort((a,b)=>b.t-a.t).slice(0,12);
  if(ult.length)h+=`<h3 style="margin:18px 0 4px;font-size:14px;color:#888;text-transform:uppercase">Últimos lançamentos</h3>`+ult.map(m=>{const p=produtos.find(x=>x.id===m.p);

    const txt=m.tipo==='compra'?`Chegou ${m.q} ${esc(p?p.nome:'(produto apagado)')}${m.custo?' · '+brl(m.custo):''}`:`Contagem: ${m.q} ${esc(p?p.nome:'(produto apagado)')}${m.calc!=null&&m.calc!==m.q?` (app dizia ${m.calc})`:''}`;
    return `<div class="mv"><span>${d} · ${txt}</span><button class="b2" style="border:0;border-radius:8px;padding:6px 10px" data-mx="${m.id}">✕</button></div>`}).join('');
  $('#dBody').innerHTML=h;
  $('#dBody').querySelectorAll('[data-min]').forEach(i=>i.onchange=()=>{const p=produtos.find(x=>x.id===i.dataset.min);if(!p)return;const n=parseInt(i.value,10);if(n>0)p.min=n;else delete p.min;salvar();toast(n>0?'Aviso com '+n+': '+p.nome:'Sem aviso: '+p.nome,1500)});

/* foto tirada no celular (câmera ou galeria): reduz para 300×300 em JPEG (~15 KB) antes de guardar */
function reduzFoto(arq){return new Promise((ok,erro)=>{const u=URL.createObjectURL(arq), im=new Image();
  im.onload=()=>{const L=300, c=document.createElement('canvas');c.width=c.height=L;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,L,L);
    const s=Math.min(L/im.width,L/im.height), w=im.width*s, h=im.height*s;x.drawImage(im,(L-w)/2,(L-h)/2,w,h);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};
  im.onerror=()=>{URL.revokeObjectURL(u);erro()};im.src=u})}

  const l=d.p.filter(x=>Array.isArray(x)&&id(x[0])&&typeof x[1]==='number'&&x[1]>0&&x[1]<100000&&tx(x[3])&&!x[2]&&!(d.v<2&&precoDoApp({nome:x[3],preco:x[1]}))); // link de antes não traz de volta preço fictício

  muda.forEach(x=>{const p=acha(x);p.preco=x[1];if(x[2])p.est=true;else delete p.est});
  novos.forEach(x=>{const p={id:x[0],e:'',nome:x[3].trim(),preco:x[1],cat:cats.some(c=>c.id===x[4])?x[4]:'',foto:''};if(x[2])p.est=true;produtos.push(p)});

/* ===== DIAS: fechamentos e o dia completo =====

const sm=a=>Math.round(a.reduce((s,x)=>s+(+x||0),0)*100)/100;
const pagsDia=(d,cs=contas)=>cs.flatMap(c=>pagsDe(c).filter(x=>x.dia===d).map(x=>({...x,c})));

  const dd=cs.filter(c=>c.dia===d), dc=dd.filter(c=>c.status!=='casa'), cz=dd.filter(c=>c.status==='casa'), pg=pagsDia(d,cs), g={}; // consumo da casa fica fora das vendas
  dc.forEach(c=>c.itens.forEach(i=>{const x=g[i.nome]=g[i.nome]||[i.nome,0,0];x[1]++;x[2]+=i.preco}));
  return {n:dc.length,vend:sm(dc.map(total)),pix:sm(pg.filter(x=>x.f==='pix').map(x=>x.v)),din:sm(pg.filter(x=>x.f==='dinheiro').map(x=>x.v)),
    casa:sm(cz.map(total)),deb:sm(pg.filter(x=>x.f==='debito').map(x=>x.v)),cre:sm(pg.filter(x=>x.f==='credito').map(x=>x.v)),
    outros:sm(pg.filter(x=>x.c.dia!==d).map(x=>x.v)),dev:sm(dc.filter(c=>c.status==='devendo').map(aPagar)),ab:dc.filter(c=>c.status==='aberta').length,

const recT=t=>sm([t.pix,t.din,t.deb,t.cre]); // recebido: Pix + dinheiro + cartão
const fechDe=d=>fech.find(f=>f.dia===d);
const totDe=d=>{const f=fechDe(d);return f&&f.arq&&f.tot?f.tot:diaTot(d)};
const ativ=c=>Math.max(c.t||0,c.abertaEm||0,c.pagoEm||0,...c.itens.map(i=>+i.t||0),...(c.hist||[]).map(e=>+e.t||0),...(c.extra||[]).map(x=>+x.t||0));

const DSEM=['domingo','segunda','terça','quarta','quinta','sexta','sábado'], MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const nomeDia=d=>DSEM[new Date(d+'T12:00:00').getDay()]+' '+dbr(d);

const numBr=s=>{s=String(s||'').trim().replace(/^R\$\s*/,'');if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return isFinite(n)&&n>=0?n:NaN};

function guardaFech(d,o){let f=fechDe(d);if(!f){f={dia:d};fech.push(f)}Object.assign(f,o,{dia:d,t:Date.now()});delete f.auto;salvar();return f}
/* todo dia que já passou ganha o registro dos totais (só com tudo enviado, para não guardar número incompleto) */
function autoFech(){
  const h=hoje(), fal=diasTodos().filter(d=>d<h&&!fechDe(d));if(!fal.length)return;
  if(sync.ligado&&(falhas||Object.keys(sync.tent||{}).length||pendentes(mapa()).length))return;

/* conta paga há mais de ARQ_DIAS sai do celular (continua no banco). Só com tudo enviado; nunca aberta, devendo ou com falta */
const ARQ_DIAS=40;let ultArq=0;
function arquiva(forca){
  if(!sync.ligado||falhas||Object.keys(sync.tent||{}).length||(!forca&&Date.now()-ultArq<3600e3))return 0;ultArq=Date.now();
  const lim=dstr(new Date(Date.now()-VIRA-ARQ_DIAS*864e5)), velho=Date.now()-ARQ_DIAS*864e5, m=mapa();
  const chaves=c=>['c:'+c.id,...c.itens.map(i=>'i:'+c.id+':'+i.u),...(c.hist||[]).map(e=>'h:'+c.id+':'+e.u)];
  const A=contas.filter(c=>c!==aberta&&(c.status==='paga'&&!falta(c)||c.status==='casa')&&c.dia<lim&&pagsDe(c).every(x=>(x.dia||'')<lim)&&ativ(c)<velho&&chaves(c).every(k=>m[k]&&sync.base[k]===imp(m[k])));
  if(!A.length)return 0;
  const ds=new Set();A.forEach(c=>{ds.add(c.dia);pagsDe(c).forEach(x=>x.dia&&ds.add(x.dia))});
  ds.forEach(d=>{const f=fechDe(d);if(f&&f.arq)return;
    const ult=Math.max(0,...contas.filter(c=>c.dia===d).map(ativ),...pagsDia(d).map(x=>+x.t||0));
    /* total de versão sem cartão (sem deb): recalcula */const n={dia:d,t:Date.now(),tot:f&&f.tot&&f.tot.deb!==undefined&&f.t>ult?f.tot:diaTot(d),arq:1};if(f&&f.cx)n.cx=f.cx;if(f)Object.assign(f,n);else fech.push(n)});
  const ids=new Set(A.map(c=>c.id));
  A.forEach(c=>{c.itens.forEach(i=>{if(i.p)(arq.vend[i.p]=arq.vend[i.p]||[]).push(+i.t||0)});chaves(c).forEach(k=>{delete sync.base[k];if(sync.tent)delete sync.tent[k]})});
  arq.ids=arq.ids.concat([...ids]);contas=contas.filter(c=>!ids.has(c.id));
  Object.keys(arq.vend).forEach(p=>{const ms=mov.filter(x=>x.p===p);if(!ms.length){delete arq.vend[p];return} // produto sem estoque controlado não precisa
    const ct=Math.max(0,...ms.filter(x=>x.tipo==='contagem').map(x=>x.t));arq.vend[p]=arq.vend[p].filter(t=>t>ct);if(!arq.vend[p].length)delete arq.vend[p]});
  salvar();return A.length;
}

/* só lê o banco (não grava nada) */

async function baixa(filtro,pronto){

  toast('Baixando do banco…',10000);
  try{let docs=[],desde=0,j;do{j=await rpc(desde,[]);docs=docs.concat(j.docs);if(j.docs.length)desde=j.docs[j.docs.length-1].r}while(j.mais);
    const ult=new Map();docs.forEach(x=>ult.set(x.k,x));const C={};
    ult.forEach(x=>{if(x.d||x.k[0]!=='c'||!x.v)return;const id=x.k.slice(2),v=x.v;if(filtro(v)){const c={id,itens:[]};CAB.forEach(k=>{if(v[k]!==undefined)c[k]=v[k]});if(c.pagoV!==undefined)c.pagoV=+c.pagoV||0;if(c.extra!==undefined)c.extra=Array.isArray(c.extra)?c.extra.filter(e=>e&&typeof e==='object').map(e=>({...e,v:+e.v||0})):[];c.nome=String(c.nome||'');C[id]=c}});
    ult.forEach(x=>{if(x.d||x.k[0]!=='i'||!x.v)return;const [,c,u]=x.k.split(':');if(C[c])C[c].itens.push({...x.v,u,preco:+x.v.preco||0})});
    toast('Pronto',1500);pronto(Object.values(C));
  }catch(e){toast('Sem internet: tente de novo',3000)}

/* ----- relatório: semana / mês ----- */
function periodo(k){const h=hoje(),menos=(d,n)=>dstr(new Date(new Date(d+'T12:00:00').getTime()-n*864e5)),fim=x=>dstr(new Date(+x.slice(0,4),+x.slice(5,7),0)),antes=x=>dstr(new Date(+x.slice(0,4),+x.slice(5,7)-2,15)).slice(0,7);
  if(k==='7'||k==='30'){const n=+k;return {a:menos(h,n-1),b:h,pa:menos(h,2*n-1),pb:menos(h,n),nome:'Últimos '+n+' dias',ant:'os '+n+' dias antes'}}
  const m=k==='mes'?h.slice(0,7):antes(h.slice(0,7)), an=antes(m);
  return {a:m+'-01',b:fim(m),pa:an+'-01',pb:fim(an),nome:cap(MES[+m.slice(5)-1])+' '+m.slice(0,4),ant:MES[+an.slice(5)-1]};

function somaPer(a,b){const ts=diasTodos().filter(d=>d>=a&&d<=b).map(d=>[d,totDe(d)]).filter(([,t])=>t.n||recT(t)), g={};

  const S=f=>sm(ts.map(([,t])=>f(t)));
  return {ts,dias:ts.filter(([,t])=>t.n).length,vend:S(t=>t.vend),rec:S(recT),pix:S(t=>t.pix),din:S(t=>t.din),cart:S(t=>sm([t.deb,t.cre])),n:ts.reduce((s,[,t])=>s+t.n,0),prods:Object.values(g).sort((x,y)=>y[1]-x[1])}}

  const sem=[0,0,0,0,0,0,0],semN=[0,0,0,0,0,0,0];A.ts.forEach(([d,t])=>{if(!t.n)return;const w=new Date(d+'T12:00:00').getDay();sem[w]+=t.vend;semN[w]++});

  if(hs.length)h+=`<h3>Horários mais fortes</h3>${hs.map(x=>`<div class="bl"><span>${String(x).padStart(2,'0')}h</span>${barra(hr[x],mh)}<b style="text-align:right">${brl(hr[x])}</b></div>`).join('')}${A.ts.some(([d])=>(fechDe(d)||{}).arq)?'<p class="nota">Dias arquivados não entram nos horários.</p>':''}`;

/* ===== CLIENTES =====
 cliente = {id,nome,tel,t,apel?:[outros nomes, normalizados],junto?:id}. No banco: h:cli:<id> (celular de versão antiga ignora).
 A conta liga ao cliente pelo nome: as contas de antes do cadastro já entram na ficha. Juntar fichas = o nome do outro vira apelido (nada é apagado). */
function telD(s){return String(s||'').replace(/\D/g,'')}
function telFmt(s){const d=telD(s);return d.length===11?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length===10?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:d}

function nomesDe(x){return [normal(x.nome),...(x.apel||[])].filter(Boolean)}
function cliDe(nome){const n=normal(nome);return n&&vivos().find(x=>nomesDe(x).includes(n))||null}
function todosClientes(){
  const m=new Map();vivos().forEach(x=>m.set('#'+x.id,{x,cs:[]}));
  contas.forEach(c=>{const x=cliDe(c.nome),k=x?'#'+x.id:normal(c.nome);if(!k)return;if(!m.has(k))m.set(k,{x:{id:null,nome:c.nome},cs:[]});m.get(k).cs.push(c)});
  return [...m.entries()].map(([k,o])=>{o.cs.sort((a,b)=>ativ(b)-ativ(a));if(!o.x.id&&o.cs.length)o.x.nome=o.cs[0].nome;
    return {k,...o,dev:sm(o.cs.filter(c=>c.status==='devendo').map(aPagar)),gasto:sm(o.cs.filter(c=>c.status!=='casa').map(total)),ult:o.cs.length?ativ(o.cs[0]):(o.x.t||0)}});
}
function juntar(alvo,o){alvo.apel=[...new Set([...(alvo.apel||[]),...nomesDe(o)])].filter(n=>n!==normal(alvo.nome));if(!alvo.apel.length)delete alvo.apel;if(!alvo.tel&&o.tel)alvo.tel=o.tel;if(o.id&&o!==alvo)o.junto=alvo.id}
/* celular: se já é de outra ficha, pergunta se é a mesma pessoa (João / Joao) */
function poeTel(nome,val,x){x=x||cliDe(nome);const d=telD(val).replace(/^55(?=\d{10,11}$)/,'');
  if(d.length<10||d.length>11){toast('Celular com DDD: 10 ou 11 números',2500);return false}

  if(outro){if(!confirm('Esse celular já é de '+outro.nome+'.\nÉ a mesma pessoa?\n\nOK = juntar '+nome+' na ficha de '+outro.nome))return false;
    juntar(outro,x||{id:null,nome});salvar();toast('Juntou na ficha de '+outro.nome,2500);return true}

    else{const a=new Set(n.split(' ')),b=pn.split(' ');s=b.filter(w=>w.length>2&&a.has(w)).length*20}
    if(s>pts){pts=s;melhor=p}});
  return pts>=20?melhor:null;
}
function lerEntrada(){
  const m=location.hash.match(/entrada=([A-Za-z0-9_-]+)/);if(!m)return null;
  try{const b=m[1].replace(/-/g,'+').replace(/_/g,'/');const txt=decodeURIComponent(escape(atob(b+'==='.slice((b.length+3)%4))));
    const d=JSON.parse(txt);return Array.isArray(d.itens)?d:null}catch(e){return null}
}
async function abrirEntrada(d){
  history.replaceState(null,'',location.pathname);
  if(!await pedirPin())return;
  donoAba='estoque';$('#dono').classList.add('on');renderDono();
  const linhas=d.itens.map((it,i)=>{const p=acharProduto(it.nome);
    return `<div style="border-bottom:1px solid #e7e2cf;padding:8px 0"><div style="font-size:14px;color:#666">Na nota: <b>${esc(it.nome)}</b></div>
     <select data-ei="${i}" style="margin-top:4px"><option value="">— não lançar —</option>${optsProd(p&&p.id)}<option value="novo">+ criar produto "${esc(it.nome)}"</option></select>
     <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px"><input data-eq="${i}" inputmode="numeric" value="${+it.q||''}" placeholder="unidades"><input data-ev="${i}" inputmode="decimal" value="${it.custo?String(it.custo).replace('.',','):''}" placeholder="R$ total"></div></div>`}).join('');
  $('#eForm').innerHTML=`<div class="cx"><b>Conferir mercadoria da foto</b><p class="nota" style="margin-top:2px">Confira se o produto e a quantidade em <b>unidades</b> estão certos (fardo de 12 = 12). Só entra no estoque quando tocar em Confirmar.</p>${linhas}
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn b1" id="iX">Cancelar</button><button class="btn b3" id="iOk">Confirmar entrada</button></div></div>`;
  $('#iX').onclick=()=>$('#eForm').innerHTML='';
  $('#iOk').onclick=()=>{const agora=Date.now();let n=0;
    d.itens.forEach((it,i)=>{let pid=$(`[data-ei="${i}"]`).value;const q=parseInt($(`[data-eq="${i}"]`).value,10);
      const v=parseFloat(($(`[data-ev="${i}"]`).value||'').replace(/\./g,'').replace(',','.'));
      if(!pid||!(q>0))return;
      if(pid==='novo'){const np={id:uid(),e:'',nome:cap(String(it.nome).trim()),preco:0,cat:''};produtos.push(np);pid=np.id}
      const p=produtos.find(x=>x.id===pid);const m={id:uid(),tipo:'compra',p:pid,q,t:agora};if(v>0){m.custo=v;p.custo=v/q}
      mov.push(m);n++});
    if(!n){toast('Nada para lançar');return}
    ultimaDif=`<div class="dif"><b>${n} produto(s) lançados</b> pela foto.${produtos.some(p=>!p.preco)?' Tem produto novo sem preço de venda: acerte em "💲 Preços" na tela inicial.':''}</div>`;
    salvar();renderEstoque();toast('Entrada lançada')};
}
{const d=lerEntrada();if(d)setTimeout(()=>abrirEntrada(d),300)}
